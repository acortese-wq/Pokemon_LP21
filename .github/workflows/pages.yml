# Baut die Spielseite (GitHub Pages) nach jedem Upload auf main neu.
name: Spielseite aktualisieren
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages neu bauen
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
