# Veröffentlicht die Spielseite nach jedem Upload auf den Standard-Branch.
# Voraussetzung (einmalig): Settings → Pages → Source: «GitHub Actions».
# Veröffentlicht wird vom Standard-Branch des Repositorys (nur dieser darf nach github-pages).
#
# Sicherung: Vor jeder Veröffentlichung prüft der Spielstand-Test, dass ein Spielstand der
# bisher veröffentlichten Version in der neuen Version vollständig erhalten bleibt.
# Schlägt der Test fehl, wird NICHT veröffentlicht und die alte Version bleibt online.
name: Spielseite veröffentlichen
on:
  push:
    branches: [claude/sleepy-allen-i14djz]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  spielstand:
    name: Spielstand bleibt erhalten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bisher veröffentlichte Version laden
        run: |
          mkdir -p alt/zahlongus alt/zahlimon
          for d in "" zahlongus/ zahlimon/; do
            curl -sfL "https://acortese-wq.github.io/Pokemon_LP21/${d}?nocache=${GITHUB_RUN_ID}" -o "alt/${d}index.html" || rm -f "alt/${d}index.html"
          done
          ls -la alt alt/*/
      - name: Browser für den Test bereitstellen
        # Nutzt den auf GitHub vorinstallierten Chrome (keine Systempakete nötig).
        # Nur falls keiner da ist, wird Chromium ohne Systempakete heruntergeladen.
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then npx playwright install chromium; fi
          echo "Browser: ${CHROME:-Playwright-Chromium}"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Spielstand-Test (alte → neue Version)
        run: node tests/spielstand-test.cjs alt
  deploy:
    needs: spielstand
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
