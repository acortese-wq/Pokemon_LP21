# Veröffentlicht die Spielseite nach jedem Upload auf main.
# Voraussetzung (einmalig): Settings → Pages → Source: «GitHub Actions».
# Veröffentlicht wird vom Standard-Branch des Repositorys (nur dieser darf nach github-pages).
name: Spielseite veröffentlichen
on:
  push:
    branches: [claude/sleepy-allen-i14djz]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
