<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zahlcraft</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: Vollbild-Spielfeld (Canvas) mit HUD oben, Hotbar und Steuerung unten; Menüs als graue Block-Inventar-Tafeln */
:root{
  color-scheme: light;
  --panel:#c6c6c6; --panel-hi:#ffffff; --panel-lo:#555555; --slot:#8b8b8b; --slot-lo:#373737;
  --ink:#2f2f2f; --ink2:#555; --white:#fff; --green:#3c8a2e; --green-d:#255a1b; --red:#c0392b; --gold:#f2c230; --sky:#87c3ff; --dirt:#6b4a2f;
  --f-pix:'Pixelify Sans','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1d1d;color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 0;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 8px;font:700 .85rem var(--f-pix);white-space:nowrap}
.hearts{font-size:1rem;letter-spacing:-1px}
.hearts .off{opacity:.25}
.ebar{width:70px;height:10px;background:#333;border:2px solid #000;position:relative}
.ebar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffe066,#ffb703)}
.xpbar{width:56px;height:6px;background:#333;border:1px solid #000;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:#7cfc5a}
.quest{max-width:min(560px,100%);background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:4px 10px;font:.85rem/1.3 var(--f-body);font-weight:700;display:flex;gap:6px;align-items:center}
.quest img{width:18px;height:18px;image-rendering:pixelated}
.right{margin-left:auto}

/* Steuerung */
#ctrl{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#hotbar{display:flex;justify-content:center;gap:3px;margin-bottom:8px;pointer-events:auto}
.hs{width:min(38px,10vw);height:min(38px,10vw);background:rgba(139,139,139,.9);border:3px solid;border-color:#373737 #fff #fff #373737;position:relative;display:grid;place-items:center;padding:0}
.hs.on{outline:3px solid #fff;outline-offset:1px;z-index:1}
.hs img{width:72%;height:72%;image-rendering:pixelated}
.hs b{position:absolute;right:1px;bottom:-1px;font:700 .75rem var(--f-body);color:#fff;text-shadow:1px 1px 0 #000}
.crow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cgrp{display:flex;gap:8px;pointer-events:auto;align-items:flex-end}
.cb{width:62px;height:62px;border-radius:10px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.55);color:#fff;font:700 1.6rem var(--f-pix);display:grid;place-items:center;padding:0}
.cb:active,.cb.down{background:rgba(255,255,255,.35)}
.cb.sm{width:50px;height:50px;font-size:1.3rem;font-family:var(--f-emoji)}
.cb.mode{font-family:var(--f-emoji);font-size:1.5rem}
.cb.mode.build{background:rgba(60,138,46,.75)}
.side{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}

/* Block-Tafeln */
#modal,#screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55);overflow:auto}
#screen{z-index:40;background:#3b2a1c;background-size:64px 64px;image-rendering:pixelated;align-items:flex-start}
.panel{width:min(480px,100%);background:var(--panel);border:4px solid;border-color:var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);box-shadow:0 0 0 3px #000;padding:14px;color:var(--ink);max-height:100%;overflow:auto;margin:auto}
.panel h2{font:700 1.35rem var(--f-pix);margin:0 0 8px;color:#3a3a3a;text-wrap:balance}
.panel h3{font:700 1.05rem var(--f-pix);margin:14px 0 6px;color:#3a3a3a}
.fine{font-size:.85rem;color:var(--ink2);margin:4px 0 8px}
.mcbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:8px;padding:8px 12px;background:#7d7d7d;border:3px solid;border-color:#c4c4c4 #3a3a3a #3a3a3a #c4c4c4;color:#fff;font:700 1.05rem var(--f-pix);text-shadow:2px 2px 0 #3a3a3a}
.mcbtn:active{border-color:#3a3a3a #c4c4c4 #c4c4c4 #3a3a3a}
.mcbtn.green{background:#3f8f3a}
.mcbtn.red{background:#a8382c}
.mcbtn.gold{background:#b8902a}
.mcbtn:disabled{opacity:.5}
.mcbtn img{width:22px;height:22px;image-rendering:pixelated}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--slot);border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo)}
.inp{width:100%;font:700 1.2rem var(--f-body);padding:10px;border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo);background:#fff;color:var(--ink)}
.warn{color:#8c1d12;font-weight:700}
.linkish{display:block;margin:14px auto 0;background:none;border:0;color:#e9e3d6;text-decoration:underline;font-size:.9rem;padding:6px}
.panel .linkish{color:var(--ink2)}

/* Aufgabe */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtitle{display:flex;align-items:center;gap:8px;font:700 1.05rem var(--f-pix);color:#3a3a3a}
.qtitle img{width:26px;height:26px;image-rendering:pixelated}
.tipb{border:3px solid;border-color:#f6e08a #8a6d12 #8a6d12 #f6e08a;background:#e2bd3a;font:700 .85rem var(--f-pix);padding:4px 8px;color:#3a2a00;flex:none}
.blitzw{display:flex;align-items:center;gap:6px;margin-top:6px}
.blitzl{font:700 .75rem var(--f-pix);color:#8a5a00;white-space:nowrap}
.blitz{flex:1;height:8px;background:#8b8b8b;position:relative;overflow:hidden;border:2px solid #373737}
.blitz i{position:absolute;inset:0;background:linear-gradient(90deg,#ff9d00,#ffe066);transform-origin:left;animation:blitz linear forwards}
@keyframes blitz{to{transform:scaleX(0)}}
.qt{margin:10px 0 6px;font:700 1.9rem var(--f-body);text-align:center;color:#222;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qt.long{font-size:1.1rem;text-align:left}
.qvis{display:flex;justify-content:center;color:#222}
.entry{display:flex;justify-content:center;min-height:50px;margin:4px 0}
.entry span{width:40px;height:50px;display:grid;place-items:center;font:700 1.9rem var(--f-body);background:#fff;border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo);margin-left:-3px;color:#1d3f8f}
.entry .cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#ddd}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kp button{height:54px;background:#9a9a9a;border:3px solid;border-color:#dcdcdc #4a4a4a #4a4a4a #dcdcdc;font:700 1.6rem var(--f-body);color:#fff;text-shadow:2px 2px 0 #4a4a4a}
.kp button:active{border-color:#4a4a4a #dcdcdc #dcdcdc #4a4a4a}
.kp .ok{background:#3f8f3a}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ch.c3{grid-template-columns:repeat(3,1fr)}
.chb{min-height:58px;background:#9a9a9a;border:3px solid;border-color:#dcdcdc #4a4a4a #4a4a4a #dcdcdc;font:700 1.4rem var(--f-body);color:#fff;text-shadow:2px 2px 0 #4a4a4a}
.ch.c3 .chb{font-size:2rem}
.fbh{font:700 1.3rem var(--f-pix);color:#8c1d12;margin:0}
.bigans{font:700 1.5rem var(--f-body);color:var(--green-d)}
.hint{background:#fff6d0;border:2px solid #c9a53a;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}
.aid{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px 0;background:#fff;border:2px solid #9a9a9a;padding:6px;color:#222}
.aid svg{max-width:100%;height:auto;overflow:visible}
.aid .cap{font-size:.85rem;font-weight:700;color:#555}
.arc{fill:none;stroke:#2a66cc;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fadeIn .35s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}
.pp{transform-box:fill-box;transform-origin:center;animation:pop2 .35s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop2{from{transform:scale(0)}}
.fly{animation:flyin .45s ease-out both}
@keyframes flyin{from{transform:translate(var(--dx),var(--dy));opacity:0}}
.drop{animation:dropIn .7s cubic-bezier(.3,1.6,.6,1) both}
@keyframes dropIn{from{transform:translateY(-40px);opacity:0}}
.hand{transform-origin:60px 60px;transform:rotate(var(--a));animation:handspin 1.3s cubic-bezier(.2,.8,.3,1) both}
@keyframes handspin{from{transform:rotate(calc(var(--a) - 360deg))}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Listen: Rezepte, Inventar */
.recipes{display:flex;flex-direction:column;gap:6px}
.rc{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;background:#8b8b8b;border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo);padding:6px;color:#fff}
.rc.off{opacity:.55}
.rc .ri{width:40px;height:40px;display:grid;place-items:center}
.rc .ri img{width:34px;height:34px;image-rendering:pixelated}
.rc b{font:700 1rem var(--f-pix);text-shadow:1px 1px 0 #333}
.rc small{display:flex;flex-wrap:wrap;gap:8px;font-weight:700;font-size:.82rem}
.need{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.25);padding:1px 5px}
.need img{width:16px;height:16px;image-rendering:pixelated}
.need.miss{color:#ffb4a8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.it{position:relative;aspect-ratio:1;background:#8b8b8b;border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo);display:grid;place-items:center;padding:0}
.it img{width:62%;height:62%;image-rendering:pixelated}
.it b{position:absolute;right:3px;bottom:1px;font:700 .85rem var(--f-body);color:#fff;text-shadow:1px 1px 0 #000}
.it small{position:absolute;left:2px;top:1px;font-size:.6rem;color:#fff;font-weight:700;text-shadow:1px 1px 0 #000;max-width:95%;overflow:hidden;white-space:nowrap}
.it.unk{opacity:.35}

/* Heute, Missionen, Plan */
.today{display:flex;flex-direction:column;gap:6px;background:#b5b5b5;border:3px solid;border-color:#888 #eee #eee #888;padding:8px 10px}
.tbar{position:relative;height:24px;background:#555;border:2px solid #222}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e2bd3a,#3f8f3a)}
.tbar span{position:relative;display:block;text-align:center;font:700 .9rem/20px var(--f-pix);color:#fff;text-shadow:1px 1px 0 #000}
.risk{display:flex;gap:8px;align-items:center;background:#f3d7d2;padding:6px 8px;font-weight:700;font-size:.9rem}
.risk.good{background:#d6efd0}
.mrow{display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:center;font-size:.9rem;font-weight:700}
.mrow img{width:20px;height:20px;image-rendering:pixelated}
.mrow .mp{font-family:var(--f-pix)}
.mrow.done{color:var(--green-d)}
.mbar{grid-column:2/4;height:6px;background:#888}
.mbar i{display:block;height:100%;background:#2a66cc}
.mis{display:grid;grid-template-columns:34px 1fr 28px;gap:8px;align-items:center;width:100%;text-align:left;margin-top:6px;background:#8b8b8b;border:3px solid;border-color:var(--slot-lo) #fff #fff var(--slot-lo);padding:8px;color:#fff;font-weight:700;text-shadow:1px 1px 0 #333}
.mis img{width:28px;height:28px;image-rendering:pixelated}
.mis .chk{width:24px;height:24px;border:3px solid #fff;display:grid;place-items:center;color:transparent;font-family:var(--f-pix);text-shadow:none}
.mis.on{background:#3f8f3a}
.mis.on .chk{color:#fff}
.streak{font:700 .9rem var(--f-pix);background:#5a3a1a;color:#ffcf5a;padding:2px 8px}

/* Dialog, Toast, Feier */
#dlg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.35)}
#dlg .panel{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;position:relative;padding-bottom:22px}
#dlg .face{font-family:var(--f-emoji);font-size:46px;line-height:1}
#dlg .who{font:700 1rem var(--f-pix);color:#1d3f8f}
#dlg .txt{font-weight:700;font-size:1.05rem;margin:2px 0 0}
#dlg .more{position:absolute;right:12px;bottom:4px;font:700 .8rem var(--f-pix);color:#1d3f8f}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;max-width:min(440px,calc(100% - 32px));background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;font:700 .95rem var(--f-pix);text-align:center;border:2px solid #fff;pointer-events:none}
.float{position:fixed;z-index:65;transform:translate(-50%,-50%);font:700 1.15rem var(--f-pix);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;animation:floatUp 1.2s ease-out forwards;white-space:nowrap;display:flex;align-items:center;gap:4px}
.float img{width:22px;height:22px;image-rendering:pixelated}
.float.dmg{color:#ff6b5b}.float.good{color:#9dff7a}.float.gold{color:#ffd84a}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%)}}
#cel{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.78);color:#fff;text-align:center;padding:24px;overflow:hidden;cursor:pointer}
.rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,211,90,.28) 0 10deg,transparent 10deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 62%);mask-image:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 14s linear infinite;pointer-events:none;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
#cel{isolation:isolate}
.cel-ic{font-family:var(--f-emoji);font-size:96px;line-height:1.1;animation:celIn .7s cubic-bezier(.3,1.6,.5,1) both}
.cel-ic img{width:110px;height:110px;image-rendering:pixelated;display:block}
#cel h2{font:700 2.1rem var(--f-pix);color:#ffd84a;text-shadow:3px 3px 0 #000;margin:0;animation:celIn .5s .2s both}
#cel p{font-weight:700;font-size:1.1rem;margin:0;max-width:24em}
#cel .more{margin-top:12px;font:700 .9rem var(--f-pix);color:#ffd84a}
@keyframes celIn{from{transform:scale(0) rotate(-20deg);opacity:0}}
.chests{display:flex;gap:12px;justify-content:center;margin:10px 0}
.chest{width:96px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.1);border:3px solid #ffd84a;color:#fff;padding:4px;animation:chestIdle 1.6s ease-in-out infinite}
.chest:nth-child(2){animation-delay:.25s}.chest:nth-child(3){animation-delay:.5s}
.chest img{width:56px;height:56px;image-rendering:pixelated}
.chest small{font:700 .75rem var(--f-pix)}
.chest.open{background:rgba(255,216,74,.35);animation:pop .5s}
.chest.other{opacity:.45;animation:none;transform:scale(.88)}
@keyframes chestIdle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-4deg)}}
@keyframes pop{50%{transform:scale(1.25)}}

/* Titel */
.logo{font:700 clamp(2.8rem,14vw,4.6rem)/1 var(--f-pix);color:#fff;text-align:center;text-shadow:0 4px 0 #555,0 8px 0 #222;letter-spacing:2px;margin:6vh 0 4px}
.logo span{color:#7cdc4a}
.sub{color:#ffe9a8;text-align:center;font:700 1rem var(--f-pix);margin:0 0 18px;text-shadow:2px 2px 0 #000}
.title{width:min(440px,100%);margin:0 auto;display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpis div{background:#b5b5b5;padding:6px;display:flex;flex-direction:column}
.kpis b{font:700 1.4rem var(--f-pix)}
.kpis span{font-size:.75rem;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:5px;border-bottom:1px solid #999;text-align:left;white-space:nowrap}
.tblwrap{overflow-x:auto}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #999}
.rowx select{max-width:58%;font:inherit;padding:4px}
.days{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem;justify-content:flex-end}
.days label{display:flex;flex-direction:column;align-items:center}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;flex-direction:column;background:#b5b5b5;padding:5px 8px;font-size:.88rem}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.arc{stroke-dashoffset:0}.fi{opacity:1}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="Spielwelt"></canvas>
  <div id="hud"></div>
  <div id="ctrl">
    <div id="hotbar"></div>
    <div class="crow">
      <div class="cgrp"><button class="cb" id="bL" aria-label="Nach links">◀</button><button class="cb" id="bR" aria-label="Nach rechts">▶</button></div>
      <div class="cgrp"><button class="cb" id="bJ" aria-label="Springen">⤒</button></div>
    </div>
  </div>
  <div class="side">
    <button class="cb sm mode" id="bMode" aria-label="Abbauen oder Bauen">⛏️</button>
    <button class="cb sm" data-act="inv" aria-label="Inventar">🎒</button>
    <button class="cb sm" data-act="craft" aria-label="Herstellen">🛠️</button>
    <button class="cb sm" data-act="menu" aria-label="Menü">☰</button>
  </div>
</div>
<div id="modal" hidden></div>
<div id="screen" hidden></div>
<div id="dlg" hidden><div class="panel" role="dialog"><div class="face" id="dlgFace"></div><div><div class="who" id="dlgWho"></div><p class="txt" id="dlgTxt"></p></div><span class="more">▼ tippen</span></div></div>
<div id="cel" hidden></div>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
/* =========================================================
   Zahlcraft – Blockwelt-Lernspiel, Mathematik 3. Klasse (LP21)
   ========================================================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad2=n=>String(n).padStart(2,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function parts(b){return [Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean)}
function jumpsAdd(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=(10-d)*u;if(d>0&&p>f){j.push(f,p-f);c+=p;continue}}j.push(p);c+=p}return j}
function jumpsSub(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=d*u;if(d>0&&p>f){j.push(f,p-f);c-=p;continue}}j.push(p);c-=p}return j}
function hintAdd(a,b){const j=jumpsAdd(a,b);if(b<10&&a>=10&&j.length===1)return `Rechne die Einer: ${a%10} + ${b} = ${a%10+b}  →  ${a+b}`;let c=a;return j.map(x=>`${c} + ${x} = ${c+=x}`).join('  →  ')}
function hintSub(a,b){const j=jumpsSub(a,b);if(b<10&&a>=10&&j.length===1&&a%10>=b)return `Rechne die Einer: ${a%10} − ${b} = ${a%10-b}  →  ${a-b}`;let c=a;return j.map(x=>`${c} − ${x} = ${c-=x}`).join('  →  ')}
const LA=(a,b)=>({t:'line',start:a,jumps:jumpsAdd(a,b)}),LS=(a,b)=>({t:'line',start:a,jumps:jumpsSub(a,b).map(x=>-x)});
function hintMal(f,b){
  if(f===1)return `1 · ${b} = ${b}`;
  if(f===10)return `10 · ${b} = ${10*b} (eine Null anhängen)`;
  if(f===2)return `Verdoppeln: ${b} + ${b} = ${2*b}`;
  if(f===5)return `10 · ${b} = ${10*b}. Die Hälfte davon ist ${5*b}.`;
  if(f===9)return `10 · ${b} = ${10*b}, dann einmal ${b} weg: ${10*b} − ${b} = ${9*b}`;
  if(f>5)return `5 · ${b} = ${5*b} und ${f-5} · ${b} = ${(f-5)*b}  →  ${5*b} + ${(f-5)*b} = ${f*b}`;
  return `In ${b}er-Schritten: `+Array.from({length:f},(_,i)=>(i+1)*b).join(', ')}
function halbHint(a){const t=Math.floor(a/10)*10,e=a-t;return e?`Die Hälfte von ${t} ist ${t/2}, die Hälfte von ${e} ist ${e/2}  →  ${a/2}`:`${a} : 2 = ${a/2}`}
function cmpQ(a,b){const s=a<b?'<':a>b?'>':'=';return {text:`${a} □ ${b}`,say:`Was passt? ${a} ist kleiner, grösser oder gleich ${b}?`,kind:'choice',choices:['<','=','>'],ans:s,hint:`${a} ${s} ${b}. Vergleiche zuerst die grösste Stelle, dann die nächste.`}}

function clockSVG(h,m){const rad=d=>d*Math.PI/180,X=(r,a)=>(60+r*Math.sin(rad(a))).toFixed(1),Y=(r,a)=>(60-r*Math.cos(rad(a))).toFixed(1);

function scene(deco){if(!deco||RM)return '';let h='';for(const [ch,n,k] of deco)for(let i=0;i<n;i++){const dur={drift:R(16,30),fall:R(6,11),rise:R(5,10),twinkle:R(2,4),sway:R(2,4),buzz:R(5,8)}[k];
  const pos=k==='drift'?`top:${R(2,36)}%`:k==='sway'?`left:${Math.round((i+.5)*100/n)-4}%`:k==='twinkle'?`left:${R(4,92)}%;top:${R(4,86)}%`:k==='buzz'?`left:${R(5,35)}%;top:${R(30,50)}%`:`left:${R(3,94)}%`;
  const sp=ch==='bubble'||ch==='ember';h+=`<span class="d-${k}${sp?' '+ch:''}" style="${pos};animation-duration:${dur}s;animation-delay:-${(Math.random()*dur).toFixed(1)}s">${sp?'':ch}</span>`}

const qlen=(x0,y0,cx,cy,x1,y1)=>{let L=0,px=x0,py=y0;for(let i=1;i<=10;i++){const t=i/10,x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,y=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1;L+=Math.hypot(x-px,y-py);px=x;py=y}return L};
function lineSVG(start,jumps,reveal,emo){const W=320,y=92,pad=26,T=.7,f=v=>v.toFixed(1);const ws=jumps.map(j=>Math.max(1.6,Math.sqrt(Math.abs(j)))),tot=ws.reduce((a,b)=>a+b,0),sc=(W-2*pad)/tot;
  let x=jumps[0]<0?W-pad:pad,v=start;const pts=[{x,v}];jumps.forEach((j,i)=>{x+=(j<0?-1:1)*ws[i]*sc;v+=j;pts.push({x,v})});
  let s=`<svg viewBox="0 0 ${W} 124" width="${W}" role="img" aria-label="Zahlenstrahl"><line x1="8" y1="${y}" x2="${W-8}" y2="${y}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>`;
  let path=`M${f(pts[0].x)} ${y-14}`;const lens=[];
  jumps.forEach((j,i)=>{const a=pts[i],b=pts[i+1],m=(a.x+b.x)/2,h=Math.min(46,16+Math.abs(b.x-a.x)*.32),dl=(i*T).toFixed(2);
    s+=`<path d="M${f(a.x)} ${y} Q${f(m)} ${f(y-2*h)} ${f(b.x)} ${y}" pathLength="1" class="arc" style="animation-delay:${dl}s"/>`;
    s+=`<text x="${f(m)}" y="${f(y-h-8)}" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a9c" class="fi" style="animation-delay:${dl}s">${j>0?'+':'−'}${Math.abs(j)}</text>`;
    path+=` Q${f(m)} ${f(y-14-2*h)} ${f(b.x)} ${y-14}`;lens.push(qlen(a.x,y-14,m,y-14-2*h,b.x,y-14))});
  pts.forEach((p,i)=>{const last=i===pts.length-1,lab=i===0||reveal?p.v:last?'?':'';

  if(emo&&!RM){const tl=lens.reduce((a,b)=>a+b,0);let acc=0;const kp=[0],kt=[0];lens.forEach((l,i)=>{acc+=l;kp.push((acc/tl).toFixed(3));kt.push(((i+1)/lens.length).toFixed(3))});kp[kp.length-1]=1;kt[kt.length-1]=1;
    s+=`<text font-size="24" text-anchor="middle" dominant-baseline="middle">${emo}<animateMotion dur="${(jumps.length*T).toFixed(2)}s" begin="0s" fill="freeze" calcMode="linear" keyPoints="${kp.join(';')}" keyTimes="${kt.join(';')}" path="${path}"/></text>`}
  return s+'</svg>'}
function dotsSVG(r,c){const g=17,W=c*g+8,H=r*g+8+(r>5?6:0);let s=`<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W*1.25,300)}" role="img" aria-label="Punktefeld">`;

function shareSVG(n,d){const q=n/d,cols=Math.min(d,5),rows=Math.ceil(d/5),cw=60,W=cols*cw+10,H=rows*cw+50,per=Math.ceil(Math.sqrt(q)),step=Math.min(.12,3/n);

function roundSVG(a,reveal){const lo=Math.floor(a/10)*10,hi=lo+10,W=300,x0=24,x1=276,X=v=>(x0+(v-lo)/10*(x1-x0)).toFixed(1),t=a%10>=5?hi:lo;

  const vein=(id,minD,n,size)=>{for(let i=0;i<n;i++){let x=Math.floor(r()*W),y=0;const hh=hs[x];y=hh+minD+Math.floor(r()*(H-2-hh-minD));for(let k=0;k<size;k++){if(x>0&&x<W-1&&y>0&&y<H-2&&world[idx(x,y)]===3)world[idx(x,y)]=id;x+=Math.round(r()*2-1);y+=Math.round(r()*2-1)}}};

  let chests=0;for(let t=0;t<600&&chests<10;t++){const x=2+Math.floor(r()*(W-4)),y=hs[x]+12+Math.floor(r()*(H-hs[x]-16));if(y<H-2&&world[idx(x,y)]===0&&solid(x,y+1)&&world[idx(x,y+1)]!==21){world[idx(x,y)]=21;chests++}}

function update(dt){shakeT=Math.max(0,shakeT-dt);const up=keys.J;P1.vx=(keys.R?SPEED:0)-(keys.L?SPEED:0);if(P1.vx)P1.face=Math.sign(P1.vx);
  if(up&&P1.onG&&!onLadder(P1))P1.vy=-JUMP;moveEnt(P1,dt,up);P1.walk=P1.vx&&P1.onG?(P1.walk||0)+dt*12:0;
  const prevNight=isNight();S.clock=(S.clock+dt/DAYLEN)%1;if(prevNight&&!isNight()){S.nights++;S.dayN++;ev('night');toast('☀️ Der Morgen ist da! Du hast die Nacht überstanden.');questCheck()}if(!prevNight&&isNight())toast(S.nights>=2?`🌙 Nacht ${S.nights+1}: Die Monster werden stärker! Baue dir ein Versteck oder kämpfe.`:'🌙 Es wird Nacht. Monster kommen! Baue dir ein Versteck oder kämpfe.');
  updateMobs(dt);for(const p of ptc){p.vy+=20*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}ptc=ptc.filter(p=>p.life>0);
  S.playT+=dt;hungerT+=dt;if(hungerT>90){hungerT=0;S.food=Math.max(0,S.food-1);dirty=true}

  regenT+=dt;if(regenT>12){regenT=0;if(Date.now()-lastHurt>8000&&S.hearts<maxHearts()&&S.food>=6)heal(1)}
  sapT+=dt;if(sapT>2){sapT=0;for(const k in S.sap){if(S.playT-S.sap[k]>110+Math.random()*40)growTree(+k)}}
  const depth=Math.floor(P1.y-top[Math.floor(P1.x+.3)]);if(depth>S.maxDepth){S.maxDepth=depth}}

/* ---------- Abbauen, Bauen, Benutzen ---------- */
function tapWorld(sx,sy){const wx=sx/TS+camX,wy=sy/TS+camY;
  for(const m of mobs)if(wx>=m.x-.2&&wx<=m.x+m.w+.2&&wy>=m.y-.2&&wy<=m.y+m.h+.2){if(near(m,4.5))attackMob(m);else toast('Zu weit weg. Geh näher ran!');return}
  for(const a of animals)if(wx>=a.x&&wx<=a.x+a.w&&wy>=a.y&&wy<=a.y+a.h){if(!near(a,4))return toast('Zu weit weg.');if(a.type==='sheep')return shear(a);return milkCow(a)}
  const tx=Math.floor(wx),ty=Math.floor(wy);if(tx<0||tx>=W||ty<0||ty>=H)return;
  const dist=Math.hypot(tx+.5-(P1.x+.3),ty+.5-(P1.y+.9));if(dist>REACH){toast('Zu weit weg. Geh näher ran!');return}
  const b=world[idx(tx,ty)];
  if(mode==='build'){if(b&&!BL[b].nonsolid){if(BL[b].use)return useBlock(tx,ty,b);return toast('Hier ist schon ein Block.')}placeBlock(tx,ty);return}
  if(!b)return;if(BL[b].use){if(BL[b].unbreak)return useBlock(tx,ty,b);openModal(`<h2>${icon(BL[b].k==='table'?'table':BL[b].k)} ${BL[b].n}</h2><button class="mcbtn green" data-act="use" data-arg="${tx},${ty}">Benutzen</button><button class="mcbtn" data-act="dig" data-arg="${tx},${ty}">⛏️ Abbauen</button><button class="mcbtn" data-act="close">Zurück</button>`);return}

ACT.use=a=>{const [x,y]=a.split(',').map(Number);closeModal();useBlock(x,y,world[idx(x,y)])};
ACT.dig=a=>{const [x,y]=a.split(',').map(Number);closeModal();mine(x,y)};
function mine(x,y){const b=world[idx(x,y)],d=BL[b];if(!d)return;if(d.unbreak)return toast(`${d.n} kann man nicht abbauen.`);
  if(d.tool&&bestPick()<d.tool)return toast(`Für ${d.n} brauchst du ${PICKN[d.tool]}.`);
  if(d.soft){if(S.energy>=1){S.energy-=1;breakBlock(x,y,b);return}
    ask(nextQ('add'),{title:'⚡ Energie aufladen!',onOk:fast=>{S.energy=Math.min(maxEnergy(),S.energy+(fast?10:7)*(S.plan&&S.plan.bonus==='energy'?1.5:1));toast('⚡ Energie aufgeladen!');breakBlock(x,y,b)}});return}
  ask(nextQ(d.q,bestPick()>d.tool+1?-1:0),{title:`⛏️ ${d.n} abbauen`,icon:d.k==='stone'?'stone':IT[d.drop]?d.drop:d.k,onOk:fast=>{breakBlock(x,y,b,fast)}})}

  if(drop){let n=1;if(d.k==='coal')n=R(1,2);if(d.xp&&(fast||(S.plan&&S.plan.bonus==='luck'))&&Math.random()<.35)n++;addItem(drop,n);const s=w2s(x+.5,y);floatAt(`${icon(drop)}+${n}`,s.x,s.y,n>1?'gold':'');

  questCheck();dirty=true}
const TEXCOL={grass:['#5b9a43','#866043'],dirt:['#866043','#6d4a32'],stone:['#7d7d7d','#6b6b6b'],sand:['#dbcf8e'],log:['#6b5132'],leaves:['#3f7d2a'],planks:['#b08a52'],coal:['#262626','#7d7d7d'],iron:['#d8af93','#7d7d7d'],gold:['#f7e04a','#7d7d7d'],diamond:['#5fe0d6','#7d7d7d'],glass:['#d9f1fb'],bricks:['#8a8a8a'],table:['#b08a52'],furnace:['#7d7d7d'],bed:['#b53a3a'],torch:['#ffd34d'],ladder:['#8a6a3d'],wool:['#eee']};
function placeBlock(x,y){const k=S.hot[S.sel];if(!k||!inv(k))return toast('Wähle unten einen Block aus, den du setzen willst.');const it=IT[k];if(!it||!it.b)return toast(`${nameOf(k)} kann man nicht setzen.`);

let qBusy=false;
function questCheck(){if(!S||qBusy)return;const q=QUESTS[S.quest];if(!q||!q.ok())return;qBusy=true;S.quest++;for(const [k,n] of q.rw)addItem(k,n);gainXP(15);save();
  const last=S.quest>=QUESTS.length;S.rq.unshift({item:q.ic,title:last?'Zahlcraft-Meister!':'Ziel geschafft!',sub:last?'Du hast alle Ziele erreicht. Jetzt kannst du bauen, was du willst!':`${q.t}. Belohnung: ${q.rw.map(([k,n])=>n+'× '+nameOf(k)).join(', ')}.`,chest:last?'big':null});
  qBusy=false;setTimeout(maybeRewards,300);setTimeout(questCheck,400)}

/* ---------- Tagesziel, Missionen, Belohnungen (wie im alten Spiel) ---------- */
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const dkOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const isGoalDay=k=>!!S.settings.goalDays[parseDay(k).getDay()];
const minOf=k=>Math.floor((S.time[k]||0)/60);
const goalMin=()=>S.settings.goalMin;
function addTime(sec){if(!S||!(sec>0))return;const k=dayKey();S.time[k]=(S.time[k]||0)+sec;if(!S.goalHit[k]&&S.time[k]>=goalMin()*60)onGoal();dirty=true}
const MT={
  stone:{ic:'stone',t:n=>`Baue ${n} Stein ab`,n:()=>P([15,20,30])},
  ore:{ic:'iron_ore',t:n=>`Baue ${n} Erze ab`,n:()=>P([4,6,8])},

};
const BONUS={energy:{ic:'⚡',n:'Energie-Boost',d:'Mehr Energie zum Graben.'},luck:{ic:'💎',n:'Glückspilz',d:'Erze geben öfter doppelt.'},strong:{ic:'⚔️',n:'Kraftpaket',d:'Monster bekommen mehr Schaden.'},xp:{ic:'⭐',n:'Doppelte Erfahrung',d:'Du steigst schneller auf.'},hearts:{ic:'❤️',n:'Extra-Herzen',d:'Zwei Herzen mehr.'}};
const misText=m=>MT[m.k].t(m.n);
function newPlan(){S.plan={day:dayKey(),offer:shuffle(Object.keys(MT)).slice(0,4).map(k=>({k,n:MT[k].n()})),sel:[],missions:[],bonus:null,chosen:false}}
function ev(kind){if(!S)return;if(S.plan&&S.plan.chosen)for(const m of S.plan.missions){if(m.done||m.k!==kind)continue;if(++m.p>=m.n){m.done=true;S.rq.push({item:MT[m.k].ic,title:'Mission geschafft!',sub:misText(m),chest:'small'});toast('✅ Mission geschafft!')}}dirty=true}
function dayCheck(){const today=dayKey();if(!S.lastDay){S.lastDay=today;newPlan();return}if(S.lastDay===today)return;
  const missed=[],d=parseDay(S.lastDay),end=parseDay(today);while(d<end){const k=dkOf(d);if(isGoalDay(k)&&!S.goalHit[k])missed.push(k);d.setDate(d.getDate()+1)}
  if(missed.length&&!S.settings.holiday){S.streak=0;if(S.settings.conseq!=='none')missed.slice(-2).forEach(steal)}
  S.lastDay=today;newPlan();for(const o of [S.time,S.goalHit,S.play]){const ks=Object.keys(o).sort();while(ks.length>60)delete o[ks.shift()]}}
const VALUE=['diamond','gold_ingot','iron_ingot','gold_ore','iron_ore','coal','torch','apple','planks','log'];
function steal(k){const y=new Date();y.setDate(y.getDate()-1);const when=k===dkOf(y)?'Gestern':`Am ${WD[parseDay(k).getDay()]}`;const it=VALUE.find(x=>inv(x)>0);
  if(!it){S.news.push({face:'🧟',text:`${when} hast du dein Tagesziel nicht geschafft. Ein Dieb-Zombie hat dich besucht, aber nichts Wertvolles gefunden.`});return}
  const n=Math.min(5,Math.ceil(inv(it)/2));addItem(it,-n);if(S.settings.conseq==='forever')S.news.push({face:'🧟',text:`${when} hast du dein Tagesziel nicht geschafft. Ein Dieb-Zombie hat ${n}× ${nameOf(it)} für immer gestohlen!`});
  else{S.lost.push({k:it,n});S.news.push({face:'🧟',text:`${when} hast du dein Tagesziel nicht geschafft. Ein Dieb-Zombie hat ${n}× ${nameOf(it)} gestohlen! Schaffe heute dein Tagesziel, dann holst du es zurück.`})}}
function onGoal(){const k=dayKey();if(S.goalHit[k])return;S.goalHit[k]=1;S.streak++;S.best=Math.max(S.best,S.streak);
  S.rq.push({icon:'🏆',title:'Tagesziel geschafft!',sub:`${goalMin()} Minuten gerechnet. ${S.streak} ${S.streak===1?'Tag':'Tage'} in Folge! Wähle eine Truhe.`,chest:'big'});
  S.lost.splice(0).forEach(l=>{addItem(l.k,l.n);S.rq.push({item:l.k,title:'Zurückgeholt!',sub:`Du hast ${l.n}× ${nameOf(l.k)} vom Dieb-Zombie zurückgeholt.`})});
  if([3,7,14,21,30,50,100].includes(S.streak)){addItem('diamond',2);S.rq.push({item:'diamond',title:`${S.streak} Tage in Folge!`,sub:'Dafür bekommst du 2 Diamanten.'})}
  dirty=true;toast('🏆 Tagesziel geschafft!');setTimeout(maybeRewards,600)}
function maybeRewards(){if(!S||!S.rq.length||Q||!modal.hidden||!dlg.hidden||!celEl.hidden||!screenEl.hidden)return;runRewards(()=>{})}
function runRewards(done){if(!S.rq.length){save();return done()}const r=S.rq.shift();celebrate(r,()=>r.chest?chestPick(r.chest==='big',()=>runRewards(done)):runRewards(done))}
setInterval(()=>{if(!S)return;if(S.lastDay&&S.lastDay!==dayKey()&&paused()===false){dayCheck();save();startDay()}maybeRewards();
  if(!paused()){const k=dayKey();S.play[k]=(S.play[k]||0)+2;const mx=S.settings.maxMin;if(mx&&S.play[k]>=mx*60&&!S.flags['limit'+k]){S.flags['limit'+k]=1;bedtime()}}},2000);

ACT.startPlan=()=>{const p=S.plan;if(p.sel.length!==2||!p.bonus)return;p.missions=p.sel.map(i=>({...p.offer[i],p:0,done:false}));p.chosen=true;save();closeScreen();sfx('win');toast("Dein Plan steht. Los geht's!")};
function todayCard(planMode){const k=dayKey(),m=minOf(k),g2=goalMin(),p=S.plan;let st='';
  if(S.settings.holiday)st='<div class="risk good">🏖️ Ferienmodus: Heute gibt es kein Pflichtziel.</div>';else if(S.goalHit[k])st='<div class="risk good">✅ Tagesziel geschafft! Super!</div>';
  else if(isGoalDay(k)&&S.settings.conseq!=='none')st='<div class="risk">🧟 Schaffst du dein Ziel nicht, kommt heute Nacht ein Dieb-Zombie und stiehlt dir etwas!</div>';
  const lost=S.lost.map(l=>`<div class="risk">${icon(l.k)} ${l.n}× ${esc(nameOf(l.k))} wurde gestohlen. Schaffe dein Tagesziel, dann holst du es zurück!</div>`).join('');

  return `<div class="today"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:var(--f-pix)">Heute</b><span class="streak">🔥 ${S.streak} ${S.streak===1?'Tag':'Tage'}</span></div>

  <ul class="log">${rows.join('')}</ul>
  <h3>Themen und Stufen</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Thema</th><th>In der Welt</th><th>Stufe</th><th>✓</th><th>✗</th><th>Quote</th></tr></thead><tbody>
  ${Object.keys(TOPICS).map(t=>{const s=stat(t),fx=st.fix[t]||'';return `<tr><td>${TOPICS[t].n}<br><small>${TOPICS[t].lp}</small></td><td>${TOPICS[t].w}</td><td><select class="fixsel" data-topic="${t}" aria-label="Stufe ${TOPICS[t].n}"><option value="" ${!fx?'selected':''}>Auto (${s.s})</option>${[1,2,3].map(v=>`<option value="${v}" ${String(fx)===String(v)?'selected':''}>fix ${v}</option>`).join('')}</select></td><td>${s.r}</td><td>${s.f}</td><td>${pct(s.r,s.r+s.f)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="fine">Das Thema hängt von der Erdschicht ab: Wer Eisen will, übt das Einmaleins. Beim Herstellen kommen Sachaufgaben aus dem Spiel. «Auto» passt die Stufe an: 5 richtige in Folge heben sie an, 3 falsche in Folge senken sie.</p>
  <h3>Zuletzt falsch gelöst</h3>${S.log.length?`<ul class="log">${S.log.slice(0,12).map(l=>`<li><span>${esc(l.t)}</span><span>Antwort: <b>${esc(l.g)}</b> · richtig: <b>${esc(String(l.a))}</b></span></li>`).join('')}</ul>`:'<p class="fine">Noch keine Fehler.</p>'}
  <h3>Spielstand übertragen</h3><textarea id="exportCode" class="inp" readonly rows="3" style="font-size:.7rem">${exportCode()}</textarea><button class="mcbtn" data-act="copyCode">Code kopieren</button>
  <label for="importCode" class="fine" style="display:block;margin-top:10px">Code einfügen</label><textarea id="importCode" class="inp" rows="3" style="font-size:.7rem"></textarea><button class="mcbtn" data-act="importCode">Spielstand laden</button>
  <h3>Neu beginnen</h3>${confirmReset===true?`<form id="gateForm"><label for="gateIn" class="fine">Zur Sicherheit: Wie viel ist 23 · 17?</label><input id="gateIn" class="inp" inputmode="numeric" autocomplete="off"><button class="mcbtn red" type="submit">Welt löschen und neu beginnen</button></form>`:'<button class="mcbtn" data-act="reset1">Neue Welt beginnen</button>'}
  <button class="mcbtn green" data-act="closeScreen">Zurück zum Spiel</button></div>`);
  $('#optGoal').addEventListener('change',e=>{st.goalMin=+e.target.value;dirty=true;const k=dayKey();if(!S.goalHit[k]&&(S.time[k]||0)>=goalMin()*60)onGoal()});
  $('#optMax').addEventListener('change',e=>{st.maxMin=+e.target.value;delete S.flags['limit'+dayKey()];dirty=true});
  $('#optConseq').addEventListener('change',e=>{st.conseq=e.target.value;dirty=true});$('#optHoliday').addEventListener('change',e=>{st.holiday=e.target.checked;dirty=true});$('#optSound').addEventListener('change',e=>{st.sound=e.target.checked;dirty=true});
  screenEl.querySelectorAll('.gday').forEach(c=>c.addEventListener('change',e=>{st.goalDays[+e.target.dataset.day]=e.target.checked?1:0;dirty=true}));
  screenEl.querySelectorAll('.fixsel').forEach(s=>s.addEventListener('change',e=>{const t=e.target.dataset.topic,v=e.target.value;if(v){st.fix[t]=+v;stat(t).s=+v}else delete st.fix[t];dirty=true}));
  const gf=$('#gateForm');if(gf)gf.addEventListener('submit',e=>{e.preventDefault();if($('#gateIn').value.trim()==='391'){wipeSave();S=null;P1=null;titleScreen()}else toast('Das stimmt nicht.')})};
ACT.reset1=()=>ACT.parents(true);
ACT.copyCode=()=>{const ta=$('#exportCode');const fb=()=>{ta.focus();ta.select();toast('Code markiert. Jetzt kopieren.')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Code kopiert.'),fb)}catch(e){fb()}};
ACT.importCode=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#importCode').value.trim()))));if(!validSave(o))throw 0;startGame(o);toast(`Welt von ${S.name} geladen.`)}catch(e){toast('Dieser Code funktioniert nicht.')}};

/* ---------- Start ---------- */
function titleScreen(){const bg=TEXURL.dirt;screenEl.style.backgroundImage=bg?`url(${bg})`:'';
  openScreen(`<div class="title"><h1 class="logo">ZAHL<span>CRAFT</span></h1><p class="sub">Graben · Bauen · Rechnen</p>
  <div class="panel"><form id="nameForm"><label for="playerName" class="fine">Wie heisst du?</label><input id="playerName" class="inp" maxlength="14" autocomplete="off" placeholder="Dein Vorname"><button class="mcbtn green" type="submit">Neue Welt erschaffen</button></form>
  ${STORE_OK?'':'<p class="warn">⚠️ Dieser Browser speichert nicht (privater Modus?). Bitte im normalen Modus öffnen.</p>'}</div>
  <a class="btn" href="zahlongus/" style="text-decoration:none">🚀 Neues Spiel: Zahlongus</a><a class="linkish" href="zahlimon/" style="text-align:center">Zum alten Spiel «Zahlimon»</a><a class="linkish" href="info.html" style="text-align:center">Impressum und Datenschutz</a></div>`);
  $('#nameForm').addEventListener('submit',e=>{e.preventDefault();unlockAudio();const n=$('#playerName').value.trim().replace(/\s+/g,' ');if(!n)return toast('Bitte schreib zuerst deinen Namen.');const s=fresh(n);startGame(s,true)})}
function startGame(s,isNew){S=s;migrate();genWorld(S.seed);if(isNew||!S.px){spawnPlayer();S.spawn=null}else{P1={x:S.px,y:S.py,w:.6,h:1.8,vx:0,vy:0,onG:false,face:1,walk:0};if(boxSolid(P1.x,P1.y,P1.w,P1.h))spawnPlayer()}
  mobs=[];animals=[];for(let i=0;i<4;i++)spawnAnimal(i%3?'sheep':'cow');screenEl.style.backgroundImage='';closeScreen();closeModal();renderHot();dayCheck();save();
  if(isNew){talk(HELP,()=>startDay())}else startDay();if(!running){running=true;requestAnimationFrame(loop)}}
(async function boot(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  try{localStorage.setItem('zc_test','1');localStorage.removeItem('zc_test')}catch(e){STORE_OK=false}
  try{const j=await idbGet();if(j)IDBSAVE=JSON.parse(j)}catch(e){}
  const sv=load();if(sv)startGame(sv,false);else titleScreen();
  if(/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host))setTimeout(()=>{fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&sessionStorage.getItem('zc_upd')!==m[1]){sessionStorage.setItem('zc_upd',m[1]);save();location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}}).catch(()=>{})},1500)})();
window.__zc={get S(){return S},get P(){return P1},get mobs(){return mobs},set mobs(v){mobs=v},world,W,H,idx,blk,top,mine,tapWorld,useBlock,addItem,ask:()=>Q,setBlock,spawnMob,w2s,GEN,aidHTML,questCheck,dayCheck,onGoal,startDay,get camX(){return camX},get camY(){return camY},get TS(){return TS}};
})();
</script>
</body>
