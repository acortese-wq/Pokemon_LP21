<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahlimon Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: eine Spalte in Handybreite auf kariertem Rechenheft-Papier mit rotem Heftrand; der Kampf ist ein eingerahmtes Spielfeld */
:root{
  color-scheme: light;
  --paper:#fbfaf3; --grid:#dbe6f1; --ink:#1e2842; --ink2:#586380; --rand:#e0574b;
  --blue:#2a66cc; --blue-d:#1b4a9c; --green:#2e9254; --green-d:#1f6b3c;
  --gold:#f0ac18; --gold-d:#b87c05; --red:#d9443a; --red-d:#9e2a22;
  --card:#ffffff; --line:#cfd8e6; --soft:#eef3f9;
  --f-disp:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;min-height:100%;margin:0 auto;padding-inline:16px;padding-block:14px 104px;position:relative}
#app::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--rand);opacity:.5;pointer-events:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.h2{font-family:var(--f-disp);font-weight:400;font-size:1.6rem;margin-block:14px 6px}
.h3{font-family:var(--f-disp);font-weight:400;font-size:1.2rem;margin-block:18px 8px}
.fine{color:var(--ink2);font-size:.9rem;margin:4px 0 12px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(30,40,66,.18)}
.pad{padding:14px 16px;margin-bottom:14px}
.warn{color:var(--red-d);font-weight:700;margin:4px 0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2)}

/* Buttons wie Farbstift-Etiketten */
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;min-height:54px;padding:12px 16px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:var(--f-disp);font-size:1.2rem;letter-spacing:.02em;box-shadow:0 4px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.big{min-height:64px;font-size:1.4rem}
.btn.sm{width:auto;min-height:44px;font-size:1.05rem;padding:8px 14px}
.btn:disabled{opacity:.45}
.mini{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700}
.linkish{display:block;margin:22px auto 0;background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:.95rem;padding:8px}

/* Typen-Etikett */
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:99px;color:#fff;background:var(--c)}

/* Titel */
.title{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:stretch;gap:14px;padding-top:6vh}
.eyebrow{margin:0;text-align:center;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:var(--ink2)}
.logo{font-family:var(--f-disp);font-weight:400;font-size:clamp(3.2rem,17vw,5rem);line-height:1;text-align:center;color:var(--ink);text-shadow:4px 4px 0 var(--gold)}
.logo span{color:var(--blue)}
.parade{display:flex;justify-content:center;gap:18px;font-family:var(--f-emoji);font-size:3.4rem;margin:6px 0 10px}
.parade span{animation:hop 1.8s ease-in-out infinite}
.parade span:nth-child(2){animation-delay:.25s}
.parade span:nth-child(3){animation-delay:.5s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
.lbl{font-weight:700;font-size:.95rem}
.inp{width:100%;font:inherit;font-size:1.3rem;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.inp.code{font-size:.75rem;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* Starter */
.starters{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0 18px}
.starter{display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto auto;column-gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 rgba(30,40,66,.18)}
.starter.on{outline:4px solid var(--c);outline-offset:2px}
.starter .se{grid-row:1/4;font-family:var(--f-emoji);font-size:56px;line-height:1;text-align:center}
.starter .sn{font-family:var(--f-disp);font-size:1.35rem}
.starter .chip{justify-self:start}
.starter .sd{font-size:.9rem;color:var(--ink2)}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 rgba(30,40,66,.18)}
.hud-n{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.hud-n b{font-family:var(--f-disp);font-weight:400;font-size:1.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-l{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.hud-s{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1rem}
.hud-b{grid-column:1/-1;display:flex;gap:6px}
.hud-b span{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-emoji);font-size:15px}
.hud-b span.got{border:2px solid var(--gold);background:#fff6dc}

/* Karte */
.map{display:flex;flex-direction:column;gap:14px;position:relative;margin-top:8px}
.map::before{content:"";position:absolute;left:37px;top:30px;bottom:30px;width:4px;background:repeating-linear-gradient(180deg,var(--line) 0 10px,transparent 10px 20px);animation:march 1.2s linear infinite}
@keyframes march{to{background-position:0 20px}}
.node{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 rgba(30,40,66,.18)}
.node:nth-child(even){margin-left:22px}
.node .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-emoji);font-size:26px;background:linear-gradient(160deg,var(--g1),var(--g2));border:2px solid var(--ink)}
.node .tx{display:flex;flex-direction:column;min-width:0}
.node .tx b{font-family:var(--f-disp);font-weight:400;font-size:1.2rem}
.node .tx small{color:var(--ink2);font-size:.85rem}
.node .st{font-family:var(--f-emoji);font-size:24px}
.node.locked{opacity:.55;filter:grayscale(.9)}
.node.now{outline:4px solid var(--gold);outline-offset:2px}

/* Region */
.rg{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:14px 0;padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:linear-gradient(100deg,var(--g1) 55%,var(--g2))}
.rg-ic{font-family:var(--f-emoji);font-size:44px}
.rg h2{font-family:var(--f-disp);font-weight:400;font-size:1.6rem}
.rg p{margin:2px 0}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.on{background:var(--gold)}
.lead{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:14px}
.lead .le{font-family:var(--f-emoji);font-size:40px}
.lead .li{flex:1;min-width:0}
.mini-dex{display:flex;flex-wrap:wrap;gap:10px}
.mini-dex span{width:52px;height:52px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-family:var(--f-emoji);font-size:28px}
.mini-dex .seen{filter:grayscale(1);opacity:.6}
.mini-dex .unk{font-family:var(--f-disp);color:var(--ink2);border-style:dashed}

/* Kampf */
.bt{position:relative;isolation:isolate;height:290px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--g1),var(--g2));transition:height .25s}
.bt.compact{height:200px}
.bt-row{display:flex;justify-content:space-between;gap:8px;padding:10px}
.foe-row{align-items:flex-start}
.me-row{align-items:flex-end}
.mon{position:relative;font-family:var(--f-emoji);font-size:78px;line-height:1;padding:0 6px;transition:font-size .25s}
.bt.compact .mon{font-size:56px}
.mon::after{content:"";position:absolute;left:50%;bottom:-.08em;width:1.2em;height:.26em;margin-left:-.6em;border-radius:50%;background:rgba(20,28,48,.18);z-index:-1}
.mon .e,.mon .b{display:inline-block}
#btIn{position:relative;z-index:1;display:grid;grid-template-rows:1fr 1fr;height:100%}
.mon.me .e{transform:scaleX(-1)}
.plate{flex:0 1 60%;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:3px 3px 0 rgba(30,40,66,.25)}
.pn{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pn span:first-child,.pn b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp{height:10px;margin-top:5px;background:var(--soft);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--green);transition:width .6s ease}
.hp i.mid{background:var(--gold)}
.hp i.low{background:var(--red)}
.pk{font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
.xp{height:4px;margin-top:3px;background:var(--soft);border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--blue)}
.own{display:block;font-size:.75rem;color:var(--ink2);margin-top:3px}
.bt.compact .pk,.bt.compact .xp,.bt.compact .own{display:none}
.bmsg{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;margin:10px 0;padding:10px 14px;background:var(--card);border:2px solid var(--ink);border-radius:12px;font-weight:700}
.menu{display:flex;flex-direction:column;gap:12px}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu2 .btn{font-size:1.02rem;min-height:50px;padding:8px}
.wait{height:60px}

/* Aufgabe */
.qc{padding:12px 14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qlab{font-size:.8rem;font-weight:700;color:var(--ink2)}
.spk{border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:1.2rem;width:44px;height:40px;flex:none}
.qvis{display:flex;justify-content:center;color:var(--ink);margin-top:4px}
.qt{margin:8px 0 6px;font-weight:700;font-size:2rem;text-align:center;font-variant-numeric:tabular-nums}
.qt.long{font-size:1.12rem;text-align:left;font-weight:700}
.entry{display:flex;justify-content:center;gap:0;margin:6px 0 4px;min-height:52px}
.entry span{width:42px;height:52px;display:grid;place-items:center;font-family:var(--f-disp);font-size:2rem;border:2px solid var(--blue);margin-left:-2px;background:#f4f8ff;color:var(--blue-d)}
.entry span:first-child{margin-left:0;border-radius:8px 0 0 8px}
.entry span:last-child{border-radius:0 8px 8px 0}
.entry span:only-child{border-radius:8px}
.entry .cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--card)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp button{height:56px;font-family:var(--f-disp);font-size:1.6rem;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line)}
.kp button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.kp .ok{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ch.c3{grid-template-columns:repeat(3,1fr)}
.chb{min-height:60px;font-family:var(--f-disp);font-size:1.4rem;border-radius:12px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--line)}
.ch.c3 .chb{font-size:2.2rem}
.fb{padding:14px 16px;border-color:var(--red)}
.fb p{margin:6px 0}
.fb-h{font-family:var(--f-disp);font-size:1.4rem;color:var(--red-d)}
.bigans{font-family:var(--f-disp);font-size:1.5rem;color:var(--green-d)}
.hint{background:#fff6dc;border-radius:10px;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}
.fb .btn{margin-top:10px}
.swl{display:flex;flex-direction:column;gap:8px}
.swb{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.swb .e{font-family:var(--f-emoji);font-size:34px}
.swb .i{flex:1;min-width:0}

/* Zahlenball (eigenes Design) */
.zball{display:inline-block;width:1em;height:1em;border-radius:50%;background:linear-gradient(180deg,var(--blue) 0 46%,var(--ink) 46% 54%,#fff 54%);border:.06em solid var(--ink);position:relative;vertical-align:middle}
.zball::after{content:"";position:absolute;left:50%;top:50%;width:.32em;height:.32em;margin:-.16em;border-radius:50%;background:var(--gold);border:.05em solid var(--ink)}
.mon .zball{font-size:.6em}
.menu2 .zball,.shop-ic .zball{font-size:1.1em}
.zball.throw{animation:throw .55s ease-out,wob .5s ease-in-out .7s 3}
.zball.done{animation:pop .5s ease-out}

/* Animationen */
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flash{50%{opacity:.25}}
@keyframes lungeM{50%{transform:translate(22px,-14px)}}
@keyframes lungeF{50%{transform:translate(-22px,14px)}}
@keyframes appear{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes faint{to{transform:translateY(50px);opacity:0}}
@keyframes throw{from{transform:translate(-190px,150px) scale(.5)}to{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.mon.hit{animation:hit .45s ease .5s,flash .45s steps(2) .5s}
.mon.me.lunge{animation:lungeM .35s ease}
.mon.foe.lunge{animation:lungeF .35s ease}
.mon.appear{animation:appear .5s cubic-bezier(.3,1.5,.6,1)}
.mon.faint{animation:faint .7s ease-in forwards}

/* Listen: Team, Laden, Dex */
.list{display:flex;flex-direction:column;gap:12px}
.tm{display:flex;gap:12px;padding:10px 12px;align-items:flex-start}
.tm-e{flex:none;width:64px;height:64px;display:grid;place-items:center;font-family:var(--f-emoji);font-size:40px;border-radius:14px;background:var(--soft);border:2px solid var(--c)}
.tm-i{flex:1;min-width:0}
.tm-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.shop{display:flex;align-items:center;gap:12px;padding:12px 14px}
.shop-ic{font-family:var(--f-emoji);font-size:34px;width:44px;text-align:center}
.shop-t{flex:1;min-width:0;display:flex;flex-direction:column}
.shop-t small{color:var(--ink2)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.dx{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--card);border:2px solid var(--ink);border-radius:12px;text-align:center}
.dx .no{font-size:.7rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.dx .de{font-family:var(--f-emoji);font-size:34px;line-height:1.2}
.dx .dn{font-weight:700;font-size:.85rem}
.dx.s .de{filter:grayscale(1);opacity:.55}
.dx.u{border-style:dashed;border-color:var(--line)}
.dx.u .de{font-family:var(--f-disp);color:var(--line)}
.nurse{font-family:var(--f-emoji);font-size:64px}

/* Entwicklung */
.evo{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12vh;text-align:center}
.evo-t{font-family:var(--f-disp);font-size:1.5rem;margin:0}
.evo-m{font-family:var(--f-emoji);font-size:120px;line-height:1;animation:evo 2.6s ease-in}
.evo-m.done{animation:pop .6s ease-out;filter:drop-shadow(0 0 18px var(--gold))}
@keyframes evo{0%,100%{filter:none}10%,30%,50%,70%,90%{filter:brightness(4) saturate(0)}20%,40%,60%,80%{filter:none}}

/* Eltern */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis div{display:flex;flex-direction:column;background:var(--soft);border-radius:12px;padding:8px 10px}
.kpis b{font-family:var(--f-disp);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpis span{font-size:.78rem;color:var(--ink2)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tbl select{font:inherit;padding:4px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;flex-direction:column;padding:6px 10px;background:var(--soft);border-radius:10px;font-size:.9rem;overflow-wrap:anywhere}
.log li span:last-child{color:var(--ink2);font-size:.82rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row input[type=checkbox]{width:24px;height:24px}
.row input[type=range]{width:50%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad .btn{margin-top:10px}

/* Navigation unten */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:4px 0;font-size:.72rem;font-weight:700;color:var(--ink2)}
.nav b{font-family:var(--f-emoji);font-size:1.45rem;font-weight:400}

/* Dialog */
#dlg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,28,48,.35);padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));cursor:pointer}
#dlg .box{position:relative;width:100%;max-width:448px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px 16px 22px;box-shadow:0 6px 0 rgba(30,40,66,.3)}
#dlg .face{font-family:var(--f-emoji);font-size:50px;line-height:1;display:inline-block;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
#dlg .face.talk{animation:talk .28s ease-in-out infinite alternate}

#toast.in{animation:appear .3s ease-out}


/* Bewegung: Szenen, Effekte, Anschauung, Feiern */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:77}
.enter{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rg .scene,.numsky{z-index:-1}
.numsky{position:fixed}
.scene span{position:absolute;font-family:var(--f-emoji);font-size:22px;line-height:1;opacity:.85}
.scene .num{font-family:var(--f-disp);font-size:38px;color:#c6d6e8;opacity:1}
.scene .bubble{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
.scene .ember{width:6px;height:6px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff7a1a}
.d-drift{animation:drift linear infinite}
@keyframes drift{from{left:-15%}to{left:105%}}
.d-fall{animation:fall linear infinite}
@keyframes fall{0%{top:-10%;transform:translateX(0) rotate(0)}50%{transform:translateX(18px) rotate(140deg)}100%{top:105%;transform:translateX(-6px) rotate(280deg)}}
.d-rise{animation:rise linear infinite}
@keyframes rise{0%{top:105%;transform:translateX(0)}50%{transform:translateX(12px)}100%{top:-14%;transform:translateX(-4px)}}
.d-twinkle{animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.d-sway{bottom:-3px;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.d-buzz{animation:buzz ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0) scaleX(1)}25%{transform:translate(70px,-22px) scaleX(1)}50%{transform:translate(140px,8px) scaleX(-1)}75%{transform:translate(60px,26px) scaleX(-1)}}
.mon .b{transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
.mon.foe .b{animation-delay:-1.1s}
.mon[data-t=luft] .b,.mon[data-t=geist] .b,.mon[data-t=magie] .b,.mon[data-t=drache] .b{animation:hover 2.2s ease-in-out infinite}
.mon[data-t=wasser] .b{animation:bob 2s ease-in-out infinite}
.mon[data-t=elektro] .b,.mon[data-t=normal] .b{animation:hopi 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes hopi{0%,70%,100%{transform:translateY(0) scale(1,1)}78%{transform:translateY(0) scale(1.08,.9)}86%{transform:translateY(-12px) scale(.95,1.06)}}
.bt.quake{animation:quake .35s}
@keyframes quake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.bstar{flex:none;font-weight:700;background:#fff6dc;border:2px solid var(--gold);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bstar.pop,.hud-s.pop{animation:pop .4s ease-out}
.float{position:fixed;z-index:76;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:2rem;pointer-events:none;animation:floatUp 1.1s ease-out forwards;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
.float.dmg{color:var(--red)}
.float.heal{color:var(--green)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
.proj,.fstar{position:fixed;left:0;top:0;z-index:76;font-family:var(--f-emoji);pointer-events:none;transform:translate(-50%,-50%)}
.proj{font-size:42px}
.fstar{font-size:26px}
.stamp{position:fixed;z-index:75;left:50%;top:var(--y);font-family:var(--f-disp);font-size:2.3rem;color:var(--green-d);background:#fff;border:4px solid var(--green);border-radius:16px;padding:2px 18px;transform:translate(-50%,-50%) rotate(-7deg);animation:stamp 1.05s ease-out forwards;pointer-events:none;white-space:nowrap;box-shadow:0 5px 0 rgba(30,40,66,.25)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(2.3)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(.95)}}
.shake{animation:hit .4s ease}
.qbtns{display:flex;gap:6px;align-items:center}
.tipb{border:2px solid var(--gold);background:#fff6dc;border-radius:10px;font-weight:700;padding:6px 10px;font-size:.9rem;height:40px}
.aid{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0;color:var(--ink)}
.aid svg{max-width:100%;height:auto;overflow:visible}
.aid .cap{font-size:.85rem;font-weight:700;color:var(--ink2)}
.arc{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fadeIn .35s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}
.pp{transform-box:fill-box;transform-origin:center;animation:pop2 .35s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop2{from{transform:scale(0)}}
.fly{animation:flyin .45s ease-out both}
@keyframes flyin{from{transform:translate(var(--dx),var(--dy));opacity:0}}
.drop{animation:dropIn .7s cubic-bezier(.3,1.6,.6,1) both}
@keyframes dropIn{from{transform:translateY(-40px);opacity:0}}
.hand{transform-origin:60px 60px;transform:rotate(var(--a));animation:handspin 1.3s cubic-bezier(.2,.8,.3,1) both}
@keyframes handspin{from{transform:rotate(calc(var(--a) - 360deg))}}
.learn{text-align:center}
.learn .hint{text-align:left}
.node:not(.locked) .ic{animation:sway2 3.2s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.me-av{position:absolute;left:-12px;top:-16px;z-index:2;font-family:var(--f-emoji);font-size:30px;animation:hopi 1.6s ease-in-out infinite}
.rg-ic,.nurse{display:inline-block;animation:hover 3s ease-in-out infinite}
.tm-e span,.dx.c .de{display:inline-block;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
#wipe{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;background:var(--ink)}
#wipe.w-grass{animation:wipeIn .3s ease-out}
#wipe.out{animation:wipeOut .38s ease-in forwards}
@keyframes wipeIn{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes wipeOut{to{opacity:0;transform:scale(1.25)}}
.grass{font-family:var(--f-emoji);font-size:70px;animation:rustle .1s linear infinite alternate}
@keyframes rustle{from{transform:rotate(-7deg) translateX(-3px)}to{transform:rotate(7deg) translateX(3px)}}
.vs{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.vs-l,.vs-r{display:grid;place-items:center;font-family:var(--f-emoji);font-size:88px;text-align:center}
.vs-l{background:var(--blue);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);animation:inL .45s ease-out both}
.vs-r{background:var(--gold);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);animation:inR .45s ease-out both}
.vs small{display:block;font-family:var(--f-disp);font-size:1.15rem;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.vs-t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:4.2rem;color:#fff;text-shadow:4px 4px 0 var(--ink);animation:vsPop .5s .35s cubic-bezier(.3,1.6,.6,1) both}
@keyframes inL{from{transform:translateX(-100%)}}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes vsPop{from{transform:translate(-50%,-50%) scale(3);opacity:0}}
#cel{position:fixed;inset:0;z-index:78;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,28,48,.74);color:#fff;text-align:center;padding:24px;cursor:pointer;overflow:hidden}
.rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,211,90,.3) 0 10deg,transparent 10deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 62%);mask-image:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 14s linear infinite;pointer-events:none;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.cel-ic{position:relative;font-family:var(--f-emoji);font-size:112px;line-height:1.1;animation:celIn .7s cubic-bezier(.3,1.6,.5,1) both}
.cel-ic span{display:inline-block;animation:hover 2.4s ease-in-out .7s infinite}
#cel h2{position:relative;font-family:var(--f-disp);font-weight:400;font-size:2.3rem;color:#ffd35a;text-shadow:3px 3px 0 var(--ink);animation:celIn .5s .2s both}
#cel p{position:relative;font-weight:700;font-size:1.15rem;margin:0;max-width:22em;animation:fadeIn .4s .5s both;opacity:0}
#cel .more{position:relative;margin-top:14px;color:#ffd35a;font-size:.9rem;animation:hop 1s ease-in-out infinite}
@keyframes celIn{from{transform:scale(0) rotate(-25deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.arc{stroke-dashoffset:0}.fi,#cel p{opacity:1}.scene{display:none}}
</style>

<body>
<main id="app"></main>
<div id="dlg" hidden><div class="box" role="dialog" aria-live="polite"><div class="face" id="dlgFace"></div><div><div class="who" id="dlgWho"></div><p class="txt" id="dlgTxt"></p></div><span class="more" aria-hidden="true">▼ tippen</span></div></div>
<div id="toast" role="status" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="wipe" hidden></div>
<div id="cel" hidden role="dialog" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* =========================================================
   Zahlimon Abenteuer – Rechenspiel für die 3. Klasse (LP21)
   ========================================================= */
const $=s=>document.querySelector(s);
const app=$('#app'),dlg=$('#dlg'),toastEl=$('#toast');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad2=n=>String(n).padStart(2,'0');

/* ---------- Bewegung: Partikel, Flugobjekte, Übergänge, Feiern ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMO="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const fxc=$('#fx'),fxx=fxc.getContext('2d');let PS=[],fxOn=false,DPR=1;
function fxSize(){DPR=Math.min(2,window.devicePixelRatio||1);fxc.width=innerWidth*DPR;fxc.height=innerHeight*DPR}
fxSize();addEventListener('resize',fxSize);
function emit(o){if(RM)return;PS.push(Object.assign({x:0,y:0,vx:0,vy:0,g:.25,life:60,age:0,size:10,rot:0,vr:0,ch:null,color:'#fff'},o));if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fxx.setTransform(DPR,0,0,DPR,0,0);fxx.clearRect(0,0,innerWidth,innerHeight);PS=PS.filter(p=>p.age<p.life);
  for(const p of PS){p.age++;p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;fxx.globalAlpha=Math.max(0,1-Math.pow(p.age/p.life,2));fxx.save();fxx.translate(p.x,p.y);fxx.rotate(p.rot);
    if(p.ch){fxx.font=`${p.size}px ${EMO}`;fxx.textAlign='center';fxx.textBaseline='middle';fxx.fillText(p.ch,0,0)}else{fxx.fillStyle=p.color;fxx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2)}
    fxx.restore()}
  fxx.globalAlpha=1;if(PS.length)requestAnimationFrame(fxLoop);else{fxOn=false;fxx.clearRect(0,0,innerWidth,innerHeight)}}
const CONF=['#2a66cc','#f0ac18','#e0574b','#2e9254','#c9509b','#4d98bd'];
function confetti(x,y,n){for(let i=0;i<(n||70);i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=4+Math.random()*8;emit({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.2,life:70+R(0,50),size:8+R(0,6),vr:(Math.random()-.5)*.4,color:P(CONF)})}}
const TFX={feuer:{ch:['🔥','✨'],g:-.12},wasser:{ch:['💧','💦'],g:.3},pflanze:{ch:['🍃','🌿'],g:.06},elektro:{ch:['⚡','✨'],g:0},stein:{ch:['🪨','💥'],g:.4},luft:{ch:['💨','🌀'],g:-.02},geist:{ch:['👻','💜'],g:-.08},magie:{ch:['✨','⭐','💖'],g:-.05},drache:{ch:['🔥','💥'],g:-.05},normal:{ch:['💥','⭐'],g:.1}};
function burst(t,x,y,n){const d=TFX[t]||TFX.normal;for(let i=0;i<(n||14);i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*5;emit({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:d.g,life:40+R(0,25),size:18+R(0,14),ch:P(d.ch),vr:(Math.random()-.5)*.2})}}
function sparkle(x,y,n){for(let i=0;i<(n||10);i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3.5;emit({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.05,life:40+R(0,20),size:14+R(0,10),ch:P(['✨','⭐'])})}}
const ctr=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}};
function floatText(t,x,y,cls){const d=document.createElement('div');d.className='float '+(cls||'');d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function projectile(ch,a,b,ms,done){if(RM||!Element.prototype.animate){done&&done();return}const d=document.createElement('div');d.className='proj';d.textContent=ch;document.body.appendChild(d);
  d.animate([{left:a.x+'px',top:a.y+'px',transform:'translate(-50%,-50%) scale(.5)'},{left:(a.x+b.x)/2+'px',top:Math.min(a.y,b.y)-40+'px',transform:'translate(-50%,-50%) scale(1.3) rotate(180deg)'},{left:b.x+'px',top:b.y+'px',transform:'translate(-50%,-50%) scale(1) rotate(360deg)'}],{duration:ms,easing:'ease-in'}).onfinish=()=>{d.remove();done&&done()}}
function flyStar(a){if(RM||!Element.prototype.animate)return;const to=$('#bstars')||$('.hud-s');if(!to)return;const b=ctr(to),d=document.createElement('div');d.className='fstar';d.textContent='⭐';document.body.appendChild(d);
  d.animate([{left:a.x+'px',top:a.y+'px',transform:'translate(-50%,-50%) scale(.5)'},{left:(a.x+b.x)/2+'px',top:Math.min(a.y,b.y)-70+'px',transform:'translate(-50%,-50%) scale(1.5)'},{left:b.x+'px',top:b.y+'px',transform:'translate(-50%,-50%) scale(.8)'}],{duration:750,easing:'ease-in-out'}).onfinish=()=>{d.remove();const p=to.closest('.bstar')||to;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}}
function stamp(t){const bt=$('#bt'),d=document.createElement('div');d.className='stamp';d.textContent=t;d.style.setProperty('--y',(bt?ctr(bt).y:innerHeight*.35)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
const wipeEl=$('#wipe'),celEl=$('#cel');let celDone=null;
function wipe(kind,a,b,cb){if(RM){cb();return}
  wipeEl.className='';wipeEl.innerHTML=kind==='vs'?`<div class="vs"><div class="vs-l"><div>${a.e}<small>${esc(a.n)}</small></div></div><div class="vs-r"><div>${b.e}<small>${esc(b.n)}</small></div></div><div class="vs-t">VS</div></div>`:'<div class="grass">🌿🌿🌿</div>';
  wipeEl.hidden=false;wipeEl.classList.add(kind==='vs'?'w-vs':'w-grass');sfx(kind==='vs'?'win':'tap');
  setTimeout(()=>{cb();wipeEl.classList.add('out');setTimeout(()=>{wipeEl.hidden=true;wipeEl.className='';wipeEl.innerHTML=''},400)},kind==='vs'?1500:800)}
function celebrate(o,done){const nmx=t=>String(t||'').replace(/\{N\}/g,S?S.name:'');
  celEl.innerHTML=`<div class="rays"></div><div class="cel-ic"><span>${o.icon}</span></div><h2>${esc(nmx(o.title))}</h2>${o.sub?`<p>${esc(nmx(o.sub))}</p>`:''}<span class="more">▼ tippen</span>`;
  celEl.hidden=false;celDone=done;sfx('win');say(`${nmx(o.title)} ${nmx(o.sub)}`);
  const x=innerWidth/2,y=innerHeight*.4;confetti(x,y,90);setTimeout(()=>confetti(x*.4,y,40),350);setTimeout(()=>confetti(x*1.6,y,40),650)}
celEl.addEventListener('click',()=>{if(celEl.hidden)return;celEl.hidden=true;const d=celDone;celDone=null;d&&d()});

/* ---------- Daten: Typen, Zahlimon, Gebiete ---------- */
const TYPES={normal:{n:'Normal',c:'#8a7f69'},feuer:{n:'Feuer',c:'#e0582a'},wasser:{n:'Wasser',c:'#2a74cf'},pflanze:{n:'Pflanze',c:'#35934a'},elektro:{n:'Elektro',c:'#c99a00'},stein:{n:'Stein',c:'#86693f'},luft:{n:'Luft',c:'#4d98bd'},geist:{n:'Geist',c:'#6a4fa3'},magie:{n:'Magie',c:'#c9509b'},drache:{n:'Drache',c:'#473bb0'}};
const EFF={feuer:{pflanze:2,wasser:.5,stein:.5,feuer:.5},wasser:{feuer:2,stein:2,pflanze:.5,wasser:.5},pflanze:{wasser:2,stein:2,feuer:.5,luft:.5,pflanze:.5},elektro:{wasser:2,luft:2,stein:.5,elektro:.5},stein:{feuer:2,luft:2,pflanze:.5},luft:{pflanze:2,elektro:.5,stein:.5},geist:{geist:2,magie:2,normal:.5},magie:{drache:2,geist:.5},drache:{drache:2,magie:.5},normal:{stein:.5,geist:.5}};
const eff=(a,d)=>(EFF[a]&&EFF[a][d])||1;

const SP={
  flammi:{n:'Flammi',e:'🦎',t:'feuer',evo:['glutox',12]},
  glutox:{n:'Glutox',e:'🐊',t:'feuer',evo:['flammdrak',22]},
  flammdrak:{n:'Flammdrak',e:'🐲',t:'feuer'},
  tropfi:{n:'Tropfi',e:'🐧',t:'wasser',evo:['wellpin',12]},
  wellpin:{n:'Wellpin',e:'🦭',t:'wasser',evo:['ozeanor',22]},
  ozeanor:{n:'Ozeanor',e:'🐋',t:'wasser'},
  blatti:{n:'Blatti',e:'🐛',t:'pflanze',evo:['kaeferli',12]},
  kaeferli:{n:'Käferli',e:'🐞',t:'pflanze',evo:['florafly',22]},
  florafly:{n:'Florafly',e:'🦋',t:'pflanze'},
  plussi:{n:'Plussi',e:'🐰',t:'normal',evo:['hoppelix',14]},
  hoppelix:{n:'Hoppelix',e:'🐇',t:'normal'},
  pusti:{n:'Pusti',e:'🐦',t:'luft',evo:['sturmi',15]},
  sturmi:{n:'Sturmi',e:'🦅',t:'luft'},
  pilzli:{n:'Pilzli',e:'🍄',t:'pflanze'},
  minuso:{n:'Minuso',e:'🦇',t:'geist'},
  kieselo:{n:'Kieselo',e:'🦔',t:'stein',evo:['felsor',16]},
  felsor:{n:'Felsor',e:'🦏',t:'stein'},
  gespensti:{n:'Gespensti',e:'👻',t:'geist'},
  ziegi:{n:'Ziegi',e:'🐐',t:'stein'},
  funki:{n:'Funki',e:'🐥',t:'elektro',evo:['blitzhahn',16]},
  blitzhahn:{n:'Blitzhahn',e:'🐓',t:'elektro'},
  eulo:{n:'Eulo',e:'🦉',t:'luft'},
  fuchsli:{n:'Fuchsli',e:'🦊',t:'feuer'},
  baerli:{n:'Bärli',e:'🐻',t:'normal'},
  quaki:{n:'Quaki',e:'🐸',t:'wasser'},

function parts(b){return [Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean)}
function jumpsAdd(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=(10-d)*u;if(d>0&&p>f){j.push(f,p-f);c+=p;continue}}j.push(p);c+=p}return j}
function jumpsSub(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=d*u;if(d>0&&p>f){j.push(f,p-f);c-=p;continue}}j.push(p);c-=p}return j}
function hintAdd(a,b){const j=jumpsAdd(a,b);if(b<10&&a>=10&&j.length===1)return `Rechne die Einer: ${a%10} + ${b} = ${a%10+b}  →  ${a+b}`;let c=a;return j.map(x=>`${c} + ${x} = ${c+=x}`).join('  →  ')}
function hintSub(a,b){const j=jumpsSub(a,b);if(b<10&&a>=10&&j.length===1&&a%10>=b)return `Rechne die Einer: ${a%10} − ${b} = ${a%10-b}  →  ${a-b}`;let c=a;return j.map(x=>`${c} − ${x} = ${c-=x}`).join('  →  ')}
const LA=(a,b)=>({t:'line',start:a,jumps:jumpsAdd(a,b)}),LS=(a,b)=>({t:'line',start:a,jumps:jumpsSub(a,b).map(x=>-x)});
function hintMal(f,b){
  if(f===1)return `1 · ${b} = ${b}`;
  if(f===10)return `10 · ${b} = ${10*b} (eine Null anhängen)`;
  if(f===2)return `Verdoppeln: ${b} + ${b} = ${2*b}`;
  if(f===5)return `Die Hälfte von 10 · ${b}: ${10*b} : 2 = ${5*b}`;
  if(f===9)return `10 · ${b} = ${10*b}, dann einmal ${b} weg: ${10*b} − ${b} = ${9*b}`;
  if(f>5)return `5 · ${b} = ${5*b} und ${f-5} · ${b} = ${(f-5)*b}  →  ${5*b} + ${(f-5)*b} = ${f*b}`;
  return `In ${b}er-Schritten: `+Array.from({length:f},(_,i)=>(i+1)*b).join(', ')}
function halbHint(a){const t=Math.floor(a/10)*10,e=a-t;return e?`Die Hälfte von ${t} ist ${t/2}, die Hälfte von ${e} ist ${e/2}  →  ${a/2}`:`${a} : 2 = ${a/2}`}

function clockSVG(h,m){const rad=d=>d*Math.PI/180,X=(r,a)=>(60+r*Math.sin(rad(a))).toFixed(1),Y=(r,a)=>(60-r*Math.cos(rad(a))).toFixed(1);

function scene(deco){if(!deco||RM)return '';let h='';for(const [ch,n,k] of deco)for(let i=0;i<n;i++){const dur={drift:R(16,30),fall:R(6,11),rise:R(5,10),twinkle:R(2,4),sway:R(2,4),buzz:R(5,8)}[k];

const qlen=(x0,y0,cx,cy,x1,y1)=>{let L=0,px=x0,py=y0;for(let i=1;i<=10;i++){const t=i/10,x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,y=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1;L+=Math.hypot(x-px,y-py);px=x;py=y}return L};
function lineSVG(start,jumps,reveal,emo){const W=320,y=92,pad=26,T=.7,f=v=>v.toFixed(1);const ws=jumps.map(j=>Math.max(1.6,Math.sqrt(Math.abs(j)))),tot=ws.reduce((a,b)=>a+b,0),sc=(W-2*pad)/tot;
  let x=jumps[0]<0?W-pad:pad,v=start;const pts=[{x,v}];jumps.forEach((j,i)=>{x+=(j<0?-1:1)*ws[i]*sc;v+=j;pts.push({x,v})});
  let s=`<svg viewBox="0 0 ${W} 124" width="${W}" role="img" aria-label="Zahlenstrahl"><line x1="8" y1="${y}" x2="${W-8}" y2="${y}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>`;
  let path=`M${f(pts[0].x)} ${y-14}`;const lens=[];
  jumps.forEach((j,i)=>{const a=pts[i],b=pts[i+1],m=(a.x+b.x)/2,h=Math.min(46,16+Math.abs(b.x-a.x)*.32),dl=(i*T).toFixed(2);
    s+=`<path d="M${f(a.x)} ${y} Q${f(m)} ${f(y-2*h)} ${f(b.x)} ${y}" pathLength="1" class="arc" style="animation-delay:${dl}s"/>`;
    s+=`<text x="${f(m)}" y="${f(y-h-8)}" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a9c" class="fi" style="animation-delay:${dl}s">${j>0?'+':'−'}${Math.abs(j)}</text>`;
    path+=` Q${f(m)} ${f(y-14-2*h)} ${f(b.x)} ${y-14}`;lens.push(qlen(a.x,y-14,m,y-14-2*h,b.x,y-14))});
  pts.forEach((p,i)=>{const last=i===pts.length-1,lab=i===0||reveal?p.v:last?'?':'';

  if(emo&&!RM){const tl=lens.reduce((a,b)=>a+b,0);let acc=0;const kp=[0],kt=[0];lens.forEach((l,i)=>{acc+=l;kp.push((acc/tl).toFixed(3));kt.push(((i+1)/lens.length).toFixed(3))});kp[kp.length-1]=1;kt[kt.length-1]=1;
    s+=`<text font-size="24" text-anchor="middle" dominant-baseline="middle">${emo}<animateMotion dur="${(jumps.length*T).toFixed(2)}s" begin="0s" fill="freeze" calcMode="linear" keyPoints="${kp.join(';')}" keyTimes="${kt.join(';')}" path="${path}"/></text>`}
  return s+'</svg>'}
function dotsSVG(r,c){const g=17,W=c*g+8,H=r*g+8+(r>5?6:0);let s=`<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W*1.25,300)}" role="img" aria-label="Punktefeld">`;

function shareSVG(n,d){const q=n/d,cols=Math.min(d,5),rows=Math.ceil(d/5),cw=60,W=cols*cw+10,H=rows*cw+50,per=Math.ceil(Math.sqrt(q)),step=Math.min(.12,3/n);

function nav(){return `<nav class="nav"><div class="in">${[['map','🗺️','Karte'],['team','🎒','Team'],['dex','📖','Zahlidex'],['shop','🛒','Laden'],['center','❤️','Center']].map(([a,i,l])=>`<button data-act="${a}"><b>${i}</b>${l}</button>`).join('')}</div></nav>`}

app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;unlockAudio();const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b)});
document.addEventListener('keydown',e=>{
  if(!celEl.hidden&&(e.key==='Enter'||e.key===' ')){e.preventDefault();celEl.click();return}
  if(!dlg.hidden&&(e.key==='Enter'||e.key===' ')){e.preventDefault();dlgTap();return}
  if(!B||B.phase!=='q'||B.q.kind==='choice')return;
  if(/^[0-9]$/.test(e.key))ACT.k(e.key);else if(e.key==='Backspace')ACT.del();else if(e.key==='Enter')ACT.submit()});

/* ---------- Dialog ---------- */
let DQ=[],Ddone=null,Dtyping=null,Dfull='';
function talk(lines,done){DQ=lines.slice();Ddone=done;if(!DQ.length){done&&done();return}nextLine()}
function nextLine(){const face=$('#dlgFace');if(!DQ.length){dlg.hidden=true;stopSpeech();const d=Ddone;Ddone=null;d&&d();return}
  const l=DQ.shift();if(l.cel){dlg.hidden=true;celebrate(l.cel,nextLine);return}
  dlg.hidden=false;const text=l.text.replace(/\{N\}/g,S?S.name:'');face.textContent=l.face||'';$('#dlgWho').textContent=l.who||'';$('#dlgWho').hidden=!l.who;
  Dfull=text;const el=$('#dlgTxt');el.textContent='';say(text);
  if(RM){el.textContent=text;return}
  face.classList.add('talk');let i=0;clearInterval(Dtyping);Dtyping=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length){clearInterval(Dtyping);Dtyping=null;setTimeout(()=>face.classList.remove('talk'),600)}},24)}
function dlgTap(){unlockAudio();if(Dtyping){clearInterval(Dtyping);Dtyping=null;$('#dlgTxt').textContent=Dfull;$('#dlgFace').classList.remove('talk');return}nextLine()}
dlg.addEventListener('click',dlgTap);

/* ---------- Bildschirme ---------- */
function titleScreen(){B=null;S=null;const sv=load();
  show(`<div class="title"><div class="scene numsky" aria-hidden="true">${RM?'':Array.from({length:14},()=>`<span class="d-rise num" style="left:${R(2,90)}%;animation-duration:${R(10,18)}s;animation-delay:-${R(0,17)}s">${P(['1','2','3','4','5','6','7','8','9','+','−','·','='])}</span>`).join('')}</div><p class="eyebrow">Das Rechen-Abenteuer · 3. Klasse</p><h1 class="logo">Zahli<span>mon</span></h1>
  <div class="parade" aria-hidden="true"><span>🦎</span><span>🐧</span><span>🐛</span></div>
  <div class="stack">${sv&&sv.name?`<button class="btn green big" data-act="cont">▶ Weiterspielen: ${esc(sv.name)}</button>`:''}
  <button class="btn ${sv?'ghost':'green big'}" data-act="newgame">Neues Spiel</button></div>
  <p class="fine center">🔊 Ton einschalten: Das Spiel liest dir alles vor.</p></div>`)}
ACT.title=titleScreen;
ACT.cont=()=>{S=load();migrate();save();mapScreen();say(`Willkommen zurück, ${S.name}!`)};
ACT.newgame=()=>{const sv=load();if(!sv)return nameScreen();
  show(`<div class="title"><h2 class="h2 center">Neues Spiel?</h2><p class="center">Es gibt schon einen Spielstand von <b>${esc(sv.name)}</b>. Wenn du neu beginnst, wird er gelöscht.</p>
  <div class="stack"><button class="btn red" data-act="newgame2">Ja, neu beginnen</button><button class="btn ghost" data-act="title">Zurück</button></div></div>`)};
ACT.newgame2=()=>nameScreen();
function nameScreen(){show(`<div class="title"><h2 class="h2 center">Wie heisst du?</h2><form id="nameForm" class="stack"><label for="playerName" class="lbl">Dein Name</label>
  <input id="playerName" class="inp" maxlength="14" autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="Dein Vorname">
  <button class="btn green" type="submit">Los geht's!</button><button type="button" class="btn ghost" data-act="title">Zurück</button></form></div>`);
  $('#nameForm').addEventListener('submit',e=>{e.preventDefault();unlockAudio();const n=$('#playerName').value.trim().replace(/\s+/g,' ');if(!n){toast('Bitte schreib zuerst deinen Namen.');return}
    S=fresh(n);save();talk(INTRO,()=>starterScreen())});
  say('Wie heisst du?')}
function starterScreen(sel){show(`<h2 class="h2">Wähle deinen Partner</h2><p class="fine">Tippe auf ein Zahlimon.</p><div class="starters">${STARTERS.map(([id,d])=>`<button class="starter ${sel===id?'on':''}" data-act="pick" data-arg="${id}" style="--c:${TYPES[SP[id].t].c}"><span class="se">${SP[id].e}</span><span class="sn">${SP[id].n}</span>${chip(SP[id].t)}<span class="sd">${d}</span></button>`).join('')}</div>
  ${sel?`<button class="btn green big" data-act="takeStarter" data-arg="${sel}">${SP[sel].n} nehmen</button>`:''}`)}
ACT.pick=id=>{starterScreen(id);say(`${SP[id].n}. Ein ${TYPES[SP[id].t].n}-Zahlimon. ${STARTERS.find(s=>s[0]===id)[1]}`)};
ACT.takeStarter=id=>{S.team=[mkMon(id,5)];S.seen[id]=S.caught[id]=1;save();
  talk([{...PROF,text:`Super Wahl! ${SP[id].n} freut sich schon auf dich.`},{...PROF,text:'Hier hast du 5 Zahlenbälle und 3 Tränke. Mit einem Zahlenball kannst du wilde Zahlimon fangen.'},{...PROF,text:'Deine Reise beginnt auf der Plus-Wiese. Viel Glück, {N}!'}],mapScreen)};

function mapScreen(){B=null;clearTimers();
  show(`${hud()}<h2 class="h2">Karte von Zahlonien</h2><p class="fine">Tippe auf ein Gebiet. Ein neues Gebiet öffnet sich, wenn du einen Orden gewinnst.</p>
  <div class="map">${RG.map((r,i)=>{const open=i<=S.badges,done=i<S.badges;return `<button class="node ${open?'':'locked'} ${i===S.badges?'now':''}" style="--g1:${r.c1};--g2:${r.c2}" data-act="${open?'region':'locked'}" data-arg="${i}">${i===Math.min(S.badges,RG.length-1)?'<span class="me-av" aria-hidden="true">🧒</span>':''}<span class="ic">${open?r.icon:'🔒'}</span><span class="tx"><b>${r.n}</b><small>${open?r.learn:'Noch verschlossen'}</small></span><span class="st">${done?r.leader.be:''}</span></button>`}).join('')}</div>
  <button class="linkish" data-act="parents">Bereich für Eltern</button>${nav()}`)}
ACT.map=mapScreen;
ACT.locked=i=>{const p=RG[i-1];const t=`Gewinne zuerst den Orden bei ${p.leader.n} in der ${p.n}.`;toast(t);say(t)};
ACT.region=i=>regionScreen(+i);

function regionScreen(i){B=null;clearTimers();const r=RG[i],L=r.leader,alive=firstAlive()>=0,beaten=S.badges>i,m=S.team[Math.max(0,firstAlive())];
  show(`${hud()}<section class="rg" style="--g1:${r.c1};--g2:${r.c2}">${scene(r.deco)}<div class="rg-ic">${r.icon}</div><div><h2>${r.n}</h2><p>Hier übst du: <b>${r.learn}</b></p>${r.topic!=='mix'?`<p>Schwierigkeit ${dots(getStufe(r.topic))}</p>`:''}</div></section>
  <div class="lead card"><span class="le">${SP[m.id].e}</span><div class="li"><div class="pn"><b>${nm(m)}</b><span class="lv">Lv ${m.lvl}</span></div>${bar('r'+m.uid,m.hp,maxHp(m))}<div class="pk">Kraft ${m.hp}/${maxHp(m)}</div></div></div>
  <div class="stack">${alive?`<button class="btn green big" data-act="wild" data-arg="${i}">🌿 Im hohen Gras suchen</button>`:`<p class="warn">Deine Zahlimon sind erschöpft.</p><button class="btn" data-act="center">❤️ Ins Zahlencenter</button>`}
  <button class="btn gold" data-act="arena" data-arg="${i}" ${alive?'':'disabled'}>🏟️ ${beaten?'Revanche':'Arena'}: ${L.n} ${beaten?L.be:''}</button>${r.topic!=='mix'?`<button class="btn ghost" data-act="learn" data-arg="${i}">📺 So geht's: ${TOPICS[r.topic].n}</button>`:''}</div>
  <h3 class="h3">Zahlimon in diesem Gebiet</h3><div class="mini-dex">${r.wild.concat(r.rare?[r.rare]:[]).map(id=>S.caught[id]?`<span title="${SP[id].n}">${SP[id].e}</span>`:S.seen[id]?`<span class="seen" title="${SP[id].n}">${SP[id].e}</span>`:'<span class="unk">?</span>').join('')}</div>${nav()}`)}

/* ---------- Kampf ---------- */
const foe=()=>B.foes[B.fi];
const myMon=()=>S.team[B.mi];
function dmg(a,d,mult){const base=10+a.lvl*1.5,diff=clamp(1+(a.lvl-d.lvl)*.05,.6,1.5);return Math.max(3,Math.round(base*diff*mult*(.9+Math.random()*.2)))}
function foeDmg(f,m,mult){return Math.max(2,Math.round((5+f.lvl*1.2)*clamp(1+(f.lvl-m.lvl)*.05,.7,1.4)*mult))}
const effTxt=m=>m>1?' Das ist sehr effektiv!':m<1?' Das ist nicht sehr effektiv …':'';

ACT.wild=i=>{i=+i;const r=RG[i];let id;
  if(i===RG.length-1&&S.champ&&!S.caught.zahlodrak&&Math.random()<.25)id='zahlodrak';
  else if(r.rare&&Math.random()<.06)id=r.rare;else id=P(r.wild);
  const f=mkFoe(id,id==='zahlodrak'?30:R(r.lv[0],r.lv[1]),false);S.seen[id]=1;save();
  B={kind:'wild',ri:i,foes:[f],fi:0,mi:firstAlive(),streak:0,phase:'anim',fx:'appear',prev:{},msg:id==='zahlodrak'?'Der Boden bebt … Das legendäre Zahlodrak erscheint!':`Ein wildes ${SP[id].n} erscheint!`};
  wipe('grass',null,null,()=>{renderBattle();say(B.msg);later(()=>{if(!S.flags.tut){S.flags.tut=1;save();talk(TUT,toMenu)}else toMenu()},1400)})};
ACT.arena=i=>{i=+i;const L=RG[i].leader;
  talk([{who:L.n,face:L.e,text:L.hi}],()=>{const foes=L.team.map(([id,l])=>mkFoe(id,l,true));S.seen[foes[0].id]=1;save();const me=S.team[firstAlive()];
    B={kind:'leader',ri:i,leader:L,foes,fi:0,mi:firstAlive(),streak:0,phase:'anim',fx:'appear',prev:{},msg:`${L.n} schickt ${nm(foes[0])} in den Kampf!`};
    wipe('vs',{e:SP[me.id].e,n:S.name},{e:L.e,n:L.n},()=>{renderBattle();say(B.msg);later(toMenu,1500)})})};

function plate(m,isFoe){const sp=SP[m.id],max=isFoe?m.max:maxHp(m);
  return `<div class="plate"><div class="pn"><span>${sp.n}</span><span class="lv">Lv ${m.lvl}</span></div>${chip(sp.t)}${bar(isFoe?'f'+B.fi:'m'+m.uid,m.hp,max)}
  ${isFoe?(B.kind==='leader'?`<span class="own">${B.leader.e} ${esc(B.leader.n)} · ${B.fi+1}/${B.foes.length}</span>`:''):`<div class="pk">Kraft ${m.hp}/${max}</div><div class="xp"><i style="width:${Math.min(100,Math.round(m.xp/need(m.lvl)*100))}%"></i></div>`}</div>`}
const monHTML=(m,side,cls,inner)=>`<div class="mon ${side} ${cls}" data-t="${SP[m.id].t}">${inner||`<span class="b"><span class="e">${SP[m.id].e}</span></span>`}</div>`;
function battleFrame(){const r=RG[B.ri];SCR='battle';show(`<div class="bt" id="bt" style="--g1:${r.c1};--g2:${r.c2}">${scene(r.deco)}<div id="btIn"></div></div><div class="bmsg"><span id="bmsgT" aria-live="polite"></span><span class="bstar">⭐ <b id="bstars"></b></span></div><div class="bctl" id="bctl"></div>`)}
function renderBattle(){if(!$('#btIn'))battleFrame();const f=foe(),m=myMon(),fx=B.fx||'';
  let foeInner='';if(fx==='ball')foeInner='<span class="zball throw"></span>';if(fx==='caught')foeInner='<span class="zball done"></span>';
  const foeCls={hitFoe:'hit',appear:'appear',faintFoe:'faint',escape:'appear',hitMe:'lunge'}[fx]||'';
  const meCls={hitMe:'hit',faintMe:'faint',appearMe:'appear',hitFoe:'lunge'}[fx]||'';
  $('#bt').classList.toggle('compact',['q','wrong','switch'].includes(B.phase));
  $('#btIn').innerHTML=`<div class="bt-row foe-row">${plate(f,true)}${monHTML(f,'foe',foeCls,foeInner)}</div><div class="bt-row me-row">${monHTML(m,'me',meCls)}${plate(m,false)}</div>`;
  $('#bmsgT').textContent=B.msg||'';$('#bstars').textContent=S.stars;$('#bctl').innerHTML=ctl();animBars();B.fx=null}
function ctl(){
  switch(B.phase){
    case 'menu':return `<div class="menu"><button class="btn green big" data-act="atk">⚔️ Angreifen</button><div class="menu2">
      <button class="btn ghost" data-act="ball" ${B.kind!=='wild'?'disabled':''}><span class="zball"></span> Fangen (${S.items.ball})</button>
      <button class="btn ghost" data-act="potion">🧪 Trank (${S.items.trank})</button>
      <button class="btn ghost" data-act="switch" ${S.team.length<2?'disabled':''}>🔄 Wechseln</button>
      <button class="btn ghost" data-act="run" ${B.kind!=='wild'?'disabled':''}>🏃 Flucht</button></div></div>`;
    case 'q':return qCard();
    case 'wrong':{const q=B.q;return `<div class="fb card"><p class="fb-h">Nicht ganz!</p><p>${esc(q.text)}</p>${q.vis?`<div class="qvis">${q.vis}</div>`:''}${aidHTML(q.aid,true)}<p>Deine Antwort: <b>${esc(B.given)}</b><br>Richtig ist: <span class="bigans">${esc(String(q.ans))}</span></p><p class="hint">💡 ${esc(q.hint||'')}</p><button class="btn" data-act="goon">Verstanden</button></div>`}
    case 'switch':return `<div class="swl">${S.team.map((t,i)=>`<button class="swb" data-act="swapTo" data-arg="${i}" ${t.hp<=0||i===B.mi?'disabled':''}><span class="e">${SP[t.id].e}</span><span class="i"><span class="pn"><b>${nm(t)}</b><span class="lv">Lv ${t.lvl}</span></span>${bar('s'+t.uid,t.hp,maxHp(t))}<span class="pk">${t.hp<=0?'erschöpft':i===B.mi?'kämpft gerade':`Kraft ${t.hp}/${maxHp(t)}`}</span></span></button>`).join('')}
      ${B.forced?'':'<button class="btn ghost" data-act="backMenu">Zurück</button>'}</div>`;
    default:return '<div class="wait"></div>'}}
function qCard(){const q=B.q,long=q.text.length>22;
  const lab=B.purpose==='catch'?'Richtig rechnen = Zahlenball werfen':'Richtig rechnen = Angriff';
  return `<div class="qc card"><div class="qhead"><span class="qlab">${lab}${q.again?' · Nochmals üben':''}</span><span class="qbtns">${q.aid&&!B.tip?'<button class="tipb" data-act="tip">💡 Tipp</button>':''}<button class="spk" data-act="speak" aria-label="Aufgabe vorlesen">🔊</button></span></div>
  ${q.vis?`<div class="qvis">${q.vis}</div>`:''}${B.tip?aidHTML(q.aid,false):''}<p class="qt ${long?'long':''}">${esc(q.text)}</p>
  ${q.kind==='choice'?`<div class="ch ${q.choices.length===3?'c3':''}">${q.choices.map(c=>`<button class="chb" data-act="choose" data-arg="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
  :`<div class="entry" id="entry" aria-live="polite">${entryHTML()}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="k" data-arg="${n}">${n}</button>`).join('')}<button data-act="del" aria-label="Löschen">⌫</button><button data-act="k" data-arg="0">0</button><button class="ok" data-act="submit">OK</button></div>`}</div>`}
function entryHTML(){return B.input?B.input.split('').map(d=>`<span>${d}</span>`).join(''):'<span class="cur"></span>'}
function toMenu(){if(!B)return;B.phase='menu';B.msg=`Was soll ${nm(myMon())} tun?`;renderBattle()}
function newQ(){B.q=nextQ(RG[B.ri].topic);B.input='';B.tip=false;B.phase='q';B.msg=B.purpose==='catch'?'Der Zahlenball ist bereit!':`${nm(myMon())} wartet auf deine Antwort …`;renderBattle();say(B.q.say)}
ACT.atk=()=>{if(B.phase!=='menu')return;B.purpose='atk';newQ()};
ACT.ball=()=>{if(B.phase!=='menu')return;if(S.items.ball<=0){toast('Du hast keine Zahlenbälle mehr. Im Laden gibt es neue.');return}B.purpose='catch';newQ()};
ACT.potion=()=>{if(B.phase!=='menu')return;const m=myMon(),max=maxHp(m);if(S.items.trank<=0){toast('Du hast keinen Trank mehr.');return}if(m.hp>=max){toast(`${nm(m)} hat schon volle Kraft.`);return}
  S.items.trank--;const h=Math.min(30,max-m.hp);m.hp+=h;save();B.msg=`${nm(m)} trinkt den Trank und bekommt ${h} Kraft zurück.`;B.phase='anim';sfx('lvl');renderBattle();say(B.msg);later(toMenu,1400)};
ACT.switch=()=>{if(B.phase!=='menu')return;B.phase='switch';B.forced=false;B.msg='Welches Zahlimon soll kämpfen?';renderBattle()};
ACT.backMenu=()=>toMenu();
ACT.swapTo=i=>{B.mi=+i;B.forced=false;B.phase='anim';B.fx='appearMe';B.msg=`Los, ${nm(myMon())}!`;renderBattle();say(B.msg);later(toMenu,1000)};
ACT.run=()=>{if(B.phase!=='menu'||B.kind!=='wild')return;endBattle('run')};
ACT.speak=()=>{if(B&&B.q)say(B.q.say)};
ACT.tip=()=>{if(!B||B.phase!=='q'||!B.q.aid)return;B.tip=true;$('#bctl').innerHTML=ctl();say('Schau genau hin. So kannst du rechnen.')};
ACT.k=d=>{if(!B||B.phase!=='q'||B.input.length>=4)return;if(B.input==='0')B.input='';B.input+=d;const el=$('#entry');if(el)el.innerHTML=entryHTML();sfx('tap')};
ACT.del=()=>{if(!B||B.phase!=='q')return;B.input=B.input.slice(0,-1);const el=$('#entry');if(el)el.innerHTML=entryHTML()};
ACT.submit=()=>{if(!B||B.phase!=='q')return;if(!B.input){toast('Tippe zuerst deine Antwort ein.');return}answer(B.input)};
ACT.choose=v=>answer(v);
function answer(v){if(B.phase!=='q')return;const q=B.q;const ok=q.kind==='choice'?v===q.ans:parseInt(v,10)===q.ans;record(q,ok,v);
  if(ok)return onCorrect();B.phase='anim';sfx('bad');const qc=$('.qc');if(qc){qc.classList.remove('shake');void qc.offsetWidth;qc.classList.add('shake')}later(()=>onWrong(v),480)}
function onCorrect(){const m=myMon(),f=foe(),qc=$('.qc'),ap=qc?ctr(qc):{x:innerWidth/2,y:innerHeight*.7};B.streak++;S.stars++;m.xp+=3;sfx('ok');sparkle(ap.x,ap.y,12);flyStar(ap);
  const praise=P(['Richtig!','Super!','Toll gemacht!','Genau!','Stark!','Bravo!']);
  if(B.purpose==='catch')return doCatch(praise);
  const mult=eff(SP[m.id].t,SP[f.id].t),sup=B.streak>=3&&!B.tip,d=dmg(m,f,mult*(sup?1.5:1));f.hp=Math.max(0,f.hp-d);
  B.phase='anim';B.fx='hitFoe';B.msg=(sup?`${praise} ${B.streak} richtig in Folge: Superangriff von ${nm(m)}!`:`${praise} ${nm(m)} greift an!`)+effTxt(mult);
  renderBattle();stamp(sup?'Superangriff!':praise);say(B.msg);attackFx(true,SP[m.id].t,d,sup);save();
  later(()=>f.hp<=0?foeFainted():toMenu(),1900)}
function onWrong(v){if(!B)return;B.streak=0;B.given=v;B.phase='wrong';B.msg='Schau dir den Rechenweg an.';renderBattle();say(`Nicht ganz. Richtig ist ${B.q.ans}. ${B.q.hint||''}`)}
ACT.goon=()=>{if(B.phase!=='wrong')return;foeAttacks(B.purpose==='catch'?'Der Zahlenball fliegt daneben! ':'')};
function attackFx(mine,type,d,sup){const a=$(mine?'.mon.me':'.mon.foe'),t=$(mine?'.mon.foe':'.mon.me');if(!a||!t)return;const pa=ctr(a),pt=ctr(t);
  later(()=>projectile((TFX[type]||TFX.normal).ch[0],pa,pt,380,()=>{burst(type,pt.x,pt.y,sup?26:14);if(sup)confetti(pt.x,pt.y,40);sfx('hit');floatText('−'+d,pt.x,pt.y-40,'dmg');
    const bt=$('#bt');if(bt){bt.classList.remove('quake');void bt.offsetWidth;bt.classList.add('quake')}}),120)}
function foeAttacks(pre){const m=myMon(),f=foe(),mult=eff(SP[f.id].t,SP[m.id].t),d=foeDmg(f,m,mult);m.hp=Math.max(0,m.hp-d);save();
  B.phase='anim';B.fx='hitMe';B.msg=`${pre}${nm(f)} greift an!${effTxt(mult)}`;renderBattle();say(B.msg);attackFx(false,SP[f.id].t,d,false);
  later(()=>m.hp<=0?meFainted():toMenu(),1700)}
function doCatch(praise){S.items.ball--;const f=foe();let ch=.45+.55*(1-f.hp/f.max);if(SP[f.id].rare)ch*=.6;const ok=Math.random()<ch;
  B.phase='anim';B.fx='ball';B.msg=`${praise} Du wirfst einen Zahlenball …`;renderBattle();say(B.msg);save();
  later(()=>{const fe=()=>{const e=$('.mon.foe');return e?ctr(e):null};
    if(ok){B.fx='caught';B.msg=`Hurra! ${nm(f)} wurde gefangen!`;sfx('win');B.boxed=addCaught(f);renderBattle();const c=fe();if(c)sparkle(c.x,c.y,22);say(B.msg);later(()=>endBattle('caught'),1600)}
    else{B.fx='escape';B.msg=`Oh nein! ${nm(f)} ist wieder ausgebrochen. Schwäche es noch etwas mehr!`;renderBattle();const c=fe();if(c)burst('normal',c.x,c.y,8);say(B.msg);later(toMenu,1900)}},2200)}
function addCaught(f){const m={id:f.id,lvl:f.lvl,xp:0,uid:S.uid++};m.hp=maxHp(m);S.caught[f.id]=S.seen[f.id]=1;if(S.team.length<6){S.team.push(m);save();return false}S.box.push(m);save();return true}
function foeFainted(){const f=foe(),m=myMon();m.xp+=f.lvl*5;S.stars+=2;save();B.phase='anim';B.fx='faintFoe';B.msg=`${nm(f)} ist besiegt! ${nm(m)} bekommt ${f.lvl*5} Erfahrung.`;sfx('win');renderBattle();say(B.msg);
  {const fe=$('.mon.foe');if(fe){const c=ctr(fe);later(()=>{sparkle(c.x,c.y,18);floatText('+'+f.lvl*5+' EP',c.x,c.y-30,'heal')},450)}}
  later(()=>{if(B.fi<B.foes.length-1){B.fi++;const n=foe();S.seen[n.id]=1;save();B.fx='appear';B.msg=`${B.leader.n} schickt ${nm(n)} in den Kampf!`;renderBattle();say(B.msg);later(toMenu,1500)}else endBattle('win')},2000)}
function meFainted(){const m=myMon();B.phase='anim';B.fx='faintMe';B.msg=`${nm(m)} ist erschöpft!`;renderBattle();say(B.msg);
  later(()=>{if(firstAlive()>=0){B.phase='switch';B.forced=true;B.msg='Wähle dein nächstes Zahlimon!';renderBattle();say(B.msg)}
    else{const ri=B.ri;clearTimers();healAll();B=null;save();talk([{who:'Pflegerin Nina',face:'👩‍⚕️',text:'Oh je, deine Zahlimon waren erschöpft. Ich habe sie wieder gesund gepflegt. Versuch es gleich nochmal, {N}!'}],()=>regionScreen(ri))}},1600)}
function levelUps(m,lines,evos){const from=m.lvl;while(m.xp>=need(m.lvl)&&m.lvl<50){m.xp-=need(m.lvl);m.lvl++;if(m.hp>0)m.hp=Math.min(maxHp(m),m.hp+4)}
  if(m.lvl>from)lines.push({cel:{icon:SP[m.id].e,title:`Level ${m.lvl}!`,sub:`${nm(m)} ist stärker geworden.`}});
  const e=SP[m.id].evo;if(m.lvl>from&&e&&m.lvl>=e[1])evos.push({m,to:e[0]})}
function endBattle(res){clearTimers();const ri=B.ri,lead=B.kind==='leader',L=RG[ri].leader,lines=[],evos=[];
  if(res==='run')lines.push({face:'🏃',text:'Du bist sicher entkommen.'});
  if(res==='caught'){const f=B.foes[0];lines.push({cel:{icon:SP[f.id].e,title:'Gefangen!',sub:B.boxed?`${SP[f.id].n} wartet in der Zahlimon-Box auf dich.`:`${SP[f.id].n} ist jetzt in deinem Team.`}})}
  if(lead&&res==='win'){lines.push({who:L.n,face:L.e,text:L.lose});
    if(S.badges===ri){S.badges=ri+1;S.stars+=20;lines.push({cel:{icon:L.be,title:L.badge,sub:'{N} bekommt den Orden und 20 Sterne!'}});
      if(ri===RG.length-1){S.champ=true;lines.push({cel:{icon:'🏆',title:'Zahlimon-Champion!',sub:'{N} hat alle 7 Orden gewonnen!'}},...CHAMP)}else lines.push({...PROF,text:`Toll gemacht, {N}! Ein neues Gebiet ist offen: ${RG[ri+1].n}.`})}
    else{S.stars+=5;lines.push({face:'⭐',text:'Revanche gewonnen! Du bekommst 5 Sterne.'})}}
  S.team.forEach(m=>levelUps(m,lines,evos));B=null;save();
  talk(lines,()=>runEvos(evos,()=>lead&&res==='win'?mapScreen():regionScreen(ri)))}
function runEvos(list,done){if(!list.length)return done();const {m,to}=list.shift(),from=m.id;SCR='evo'+Math.random();
  show(`<div class="evo"><div class="rays"></div><p class="evo-t" id="evoT">Nanu? ${SP[from].n} verändert sich …</p><div class="evo-m" id="evoM">${SP[from].e}</div><button class="btn green" id="evoB" data-act="evoNext" hidden>Weiter</button></div>`);
  say(`Nanu? ${SP[from].n} verändert sich!`);EVO_NEXT=()=>runEvos(list,done);
  later(()=>{m.id=to;S.seen[to]=S.caught[to]=1;save();const el=$('#evoM');if(!el)return;el.textContent=SP[to].e;el.classList.add('done');const c=ctr(el);confetti(c.x,c.y,90);sparkle(c.x,c.y,24);
    const t=`Glückwunsch! Aus ${SP[from].n} wurde ${SP[to].n}!`;$('#evoT').textContent=t;$('#evoB').hidden=false;sfx('win');say(t)},2700)}
ACT.evoNext=()=>{clearTimers();const f=EVO_NEXT;EVO_NEXT=null;f&&f()};

/* ---------- Team, Zahlidex, Laden, Zahlencenter ---------- */
function monRow(m,i,where){const sp=SP[m.id],max=maxHp(m);
  const btns=where==='team'?[i>0?`<button class="mini" data-act="lead" data-arg="${i}">Nach vorne</button>`:'<span class="pill">kämpft zuerst</span>',m.hp<max&&S.items.trank?`<button class="mini" data-act="potionT" data-arg="${i}">🧪 Trank</button>`:'',S.team.length>1?`<button class="mini" data-act="toBox" data-arg="${i}">In die Box</button>`:'']
    :[S.team.length<6?`<button class="mini" data-act="fromBox" data-arg="${i}">Ins Team</button>`:'<span class="fine">Das Team ist voll.</span>'];
  const e=sp.evo?`Entwickelt sich mit Level ${sp.evo[1]}`:'';
  return `<div class="tm card"><div class="tm-e" style="--c:${TYPES[sp.t].c}"><span>${sp.e}</span></div><div class="tm-i"><div class="pn"><b>${sp.n}</b><span class="lv">Lv ${m.lvl}</span></div>${chip(sp.t)}${bar('t'+m.uid,m.hp,max)}<div class="pk">Kraft ${m.hp}/${max} · Erfahrung ${m.xp}/${need(m.lvl)}${e?'<br>'+e:''}</div><div class="tm-b">${btns.join('')}</div></div></div>`}
function teamScreen(){B=null;clearTimers();show(`${hud()}<h2 class="h2">Dein Team</h2><p class="fine">Das oberste Zahlimon kämpft zuerst. Nur wer kämpft, sammelt Erfahrung. Tränke: ${S.items.trank}</p>
  <div class="list">${S.team.map((m,i)=>monRow(m,i,'team')).join('')}</div>${S.box.length?`<h3 class="h3">Zahlimon-Box (${S.box.length})</h3><div class="list">${S.box.map((m,i)=>monRow(m,i,'box')).join('')}</div>`:''}${nav()}`)}
ACT.team=teamScreen;
ACT.lead=i=>{const m=S.team.splice(+i,1)[0];S.team.unshift(m);save();teamScreen()};
ACT.potionT=i=>{const m=S.team[+i];if(!S.items.trank)return;S.items.trank--;m.hp=Math.min(maxHp(m),m.hp+30);save();sfx('lvl');toast(`${nm(m)} fühlt sich besser!`);teamScreen()};
ACT.toBox=i=>{if(S.team.length<2)return;S.box.push(S.team.splice(+i,1)[0]);save();teamScreen()};
ACT.fromBox=i=>{if(S.team.length>=6)return;S.team.push(S.box.splice(+i,1)[0]);save();teamScreen()};
function dexScreen(){B=null;clearTimers();const ids=Object.keys(SP),c=ids.filter(i=>S.caught[i]).length;
  show(`${hud()}<h2 class="h2">Zahlidex</h2><p class="fine">Gefangen: <b>${c}</b> von ${ids.length}. Graue Zahlimon hast du schon gesehen, aber noch nicht gefangen.</p>
  <div class="dex">${ids.map((id,i)=>{const sp=SP[id],st=S.caught[id]?'c':S.seen[id]?'s':'u';return `<div class="dx ${st}"><span class="no">Nr. ${pad2(i+1)}</span><span class="de">${st==='u'?'?':sp.e}</span><span class="dn">${st==='u'?'???':sp.n}</span>${st!=='u'?chip(sp.t):''}</div>`}).join('')}</div>${nav()}`)}
ACT.dex=dexScreen;
function shopScreen(){B=null;clearTimers();show(`${hud()}<h2 class="h2">Laden</h2><p class="fine">Für jede richtige Antwort bekommst du einen Stern.</p>
  <div class="list">${SHOP.map(([k,n,d,p])=>`<div class="card shop"><div class="shop-ic">${k==='ball'?'<span class="zball"></span>':'🧪'}</div><div class="shop-t"><b>${n}</b><small>${d}</small><small>Im Rucksack: ${S.items[k]}</small></div><button class="btn gold sm" data-act="buy" data-arg="${k}" ${S.stars<p?'disabled':''}>⭐ ${p}</button></div>`).join('')}</div>${nav()}`)}
ACT.shop=shopScreen;
ACT.buy=k=>{const it=SHOP.find(s=>s[0]===k);if(S.stars<it[3])return;S.stars-=it[3];S.items[k]++;save();sfx('ok');toast(`${it[1]} gekauft!`);shopScreen()};
function centerScreen(){B=null;clearTimers();show(`${hud()}<section class="card pad center"><div class="nurse">👩‍⚕️</div><h2 class="h2">Zahlencenter</h2><p>Pflegerin Nina macht deine Zahlimon wieder gesund. Das kostet nichts.</p><button class="btn green" data-act="heal">❤️ Alle gesund pflegen</button></section>
  <div class="list">${S.team.map(m=>`<div class="tm card"><div class="tm-e" style="--c:${TYPES[SP[m.id].t].c}"><span>${SP[m.id].e}</span></div><div class="tm-i"><div class="pn"><b>${nm(m)}</b><span class="lv">Lv ${m.lvl}</span></div>${bar('c'+m.uid,m.hp,maxHp(m))}<div class="pk">Kraft ${m.hp}/${maxHp(m)}</div></div></div>`).join('')}</div>${nav()}`)}
ACT.center=centerScreen;
ACT.heal=()=>{healAll();save();sfx('win');const t='Deine Zahlimon sind wieder fit!';say(t);toast(t);centerScreen()};

/* ---------- Eltern ---------- */
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
function voiceInfo(){if(!('speechSynthesis' in window))return 'Dieser Browser kann nicht vorlesen.';return SPK.voice?`Stimme: ${esc(SPK.voice.name)} (${esc(SPK.voice.lang)})`:'Keine deutsche Stimme gefunden. In den Einstellungen des Geräts eine deutsche Stimme installieren.'}
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ''}}
function parentsScreen(confirmReset){B=null;clearTimers();const d=S.days[dayKey()]||[0,0];let tr=0,tf=0;Object.values(S.stats).forEach(s=>{tr+=s.r;tf+=s.f});
  show(`<h2 class="h2">Bereich für Eltern</h2>
  <section class="card pad"><h3 class="h3">Überblick</h3><div class="kpis"><div><b>${d[0]+d[1]}</b><span>Aufgaben heute</span></div><div><b>${pct(d[0],d[0]+d[1])}</b><span>heute richtig</span></div><div><b>${tr+tf}</b><span>Aufgaben total</span></div></div>
  <p class="fine">Trainer: ${esc(S.name)} · Orden ${S.badges} von 7 · Zahlidex ${Object.keys(S.caught).length} von ${Object.keys(SP).length}</p></section>
  <section class="card pad"><h3 class="h3">Themen und Stufen</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Thema</th><th>LP21</th><th>Stufe</th><th>✓</th><th>✗</th><th>Quote</th></tr></thead><tbody>
  ${Object.keys(TOPICS).map(t=>{const s=stat(t),fx=S.settings.fix[t]||'';return `<tr><td>${TOPICS[t].n}</td><td>${TOPICS[t].lp}</td><td><select id="fix-${t}" class="fixsel" data-topic="${t}" aria-label="Stufe ${TOPICS[t].n}"><option value="" ${!fx?'selected':''}>Auto (${s.s})</option>${[1,2,3].map(v=>`<option value="${v}" ${String(fx)===String(v)?'selected':''}>fix ${v}</option>`).join('')}</select></td><td>${s.r}</td><td>${s.f}</td><td>${pct(s.r,s.r+s.f)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="fine">Stufe 1: Zahlenraum bis 100, einfache Reihen. Stufe 2: Übergänge, Hunderter, alle Grundreihen. Stufe 3: Zahlenraum bis 1000, 7er/8er/9er-Reihe, Textaufgaben mit zwei Schritten. «Auto» passt die Stufe laufend an: 5 richtige Antworten in Folge heben sie an, 3 falsche in Folge senken sie.</p></section>
  <section class="card pad"><h3 class="h3">Zuletzt falsch gelöst</h3>${S.log.length?`<ul class="log">${S.log.slice(0,15).map(l=>`<li><span>${esc(l.t)}</span><span>Antwort: <b>${esc(l.g)}</b> · richtig: <b>${esc(String(l.a))}</b></span></li>`).join('')}</ul>`:'<p class="fine">Noch keine Fehler.</p>'}
  <p class="fine">Falsch gelöste Aufgaben kommen später noch einmal, bis sie sitzen.</p></section>
  <section class="card pad"><h3 class="h3">Einstellungen</h3>
  <label class="row" for="optSpeech"><span>Vorlesen (Hochdeutsch)</span><input type="checkbox" id="optSpeech" ${S.settings.speech?'checked':''}></label>
  <label class="row" for="optRate"><span>Sprechtempo</span><input type="range" id="optRate" min="0.7" max="1.2" step="0.05" value="${S.settings.rate}"></label>
  <label class="row" for="optSound"><span>Töne</span><input type="checkbox" id="optSound" ${S.settings.sound?'checked':''}></label>
  <button class="btn ghost" data-act="testVoice">🔊 Stimme testen</button><p class="fine">${voiceInfo()}</p></section>
  <section class="card pad"><h3 class="h3">Spielstand übertragen</h3><p class="fine">Der Spielstand ist nur in diesem Browser gespeichert. Für ein anderes Gerät: Code kopieren und dort hier einfügen.</p>
  <textarea id="exportCode" class="inp code" readonly rows="3">${exportCode()}</textarea><button class="btn ghost" data-act="copyCode">Code kopieren</button>
  <label for="importCode" class="lbl" style="display:block;margin-top:14px">Code einfügen</label><textarea id="importCode" class="inp code" rows="3"></textarea><button class="btn ghost" data-act="importCode">Spielstand laden</button></section>
  <section class="card pad"><h3 class="h3">Neu beginnen</h3>${confirmReset?`<p class="warn">Wirklich alles löschen? Das lässt sich nicht rückgängig machen.</p><div class="row2"><button class="btn red" data-act="reset2">Ja, löschen</button><button class="btn ghost" data-act="parents">Abbrechen</button></div>`:'<button class="btn ghost" data-act="reset1">Spielstand löschen</button>'}</section>
  <button class="btn" data-act="map">⬅ Zurück zum Spiel</button>`);
  $('#optSpeech').addEventListener('change',e=>{S.settings.speech=e.target.checked;save();if(!e.target.checked)stopSpeech()});
  $('#optRate').addEventListener('change',e=>{S.settings.rate=+e.target.value;save();say('So schnell spreche ich jetzt.')});
  $('#optSound').addEventListener('change',e=>{S.settings.sound=e.target.checked;save()});
  app.querySelectorAll('.fixsel').forEach(sel=>sel.addEventListener('change',e=>{const t=e.target.dataset.topic,v=e.target.value;if(v){S.settings.fix[t]=+v;stat(t).s=+v}else delete S.settings.fix[t];save()}))}
ACT.parents=()=>parentsScreen(false);
ACT.testVoice=()=>say(`Hallo ${S.name}! Wie viel ist 7 · 8?`);
ACT.copyCode=()=>{const ta=$('#exportCode');const fb=()=>{ta.focus();ta.select();toast('Code markiert. Jetzt kopieren.')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Code kopiert.'),fb)}catch(e){fb()}};
ACT.importCode=()=>{const v=$('#importCode').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||!o.name||!Array.isArray(o.team)||!o.team.length)throw 0;S=o;migrate();save();toast(`Spielstand von ${S.name} geladen.`);mapScreen()}catch(e){toast('Dieser Code funktioniert nicht. Bitte vollständig einfügen.')}};
ACT.reset1=()=>parentsScreen(true);
ACT.reset2=()=>{try{localStorage.removeItem(KEY)}catch(e){}titleScreen()};

/* ---------- Erklärung «So geht's» ---------- */
let LQ=null;
function learnScreen(i,again){const r=RG[i],t=r.topic;if(!again||!LQ){let q;for(let k=0;k<40;k++){q=GEN[t](getStufe(t));if(q.aid||q.vis)break}q.topic=t;q.say=q.say||q.text;LQ=q}
  const q=LQ,dl=q.aid&&q.aid.t==='line'?q.aid.jumps.length*.7+.6:1.6;SCR='learn'+i;B=null;clearTimers();
  show(`${hud()}<h2 class="h2">So geht's: ${TOPICS[t].n}</h2><div class="card pad learn"><p class="qt ${q.text.length>22?'long':''}">${esc(q.text)}</p>${q.vis?`<div class="qvis">${q.vis}</div>`:''}${aidHTML(q.aid,true)}
  <p class="hint fi" style="animation-delay:${dl.toFixed(1)}s">💡 ${esc(q.hint)}</p><p class="fi" style="animation-delay:${(dl+.4).toFixed(1)}s">Lösung: <span class="bigans">${esc(String(q.ans))}</span></p></div>
  <div class="row2"><button class="btn ghost" data-act="learnAgain" data-arg="${i}">🔁 Nochmal</button><button class="btn" data-act="learnNew" data-arg="${i}">✨ Neues Beispiel</button></div>
  <button class="btn ghost" style="margin-top:12px" data-act="region" data-arg="${i}">⬅ Zurück</button>${nav()}`);
  say(`Schau zu! ${q.say} ${q.hint}`)}
ACT.learn=i=>learnScreen(+i,false);ACT.learnNew=i=>learnScreen(+i,false);ACT.learnAgain=i=>learnScreen(+i,true);

const wrapS=(f,k)=>function(...a){SCR=typeof k==='function'?k(...a):k;return f.apply(this,a)};
titleScreen=wrapS(titleScreen,'title');nameScreen=wrapS(nameScreen,'name');starterScreen=wrapS(starterScreen,'starter');mapScreen=wrapS(mapScreen,'map');regionScreen=wrapS(regionScreen,i=>'region'+i);
teamScreen=wrapS(teamScreen,'team');dexScreen=wrapS(dexScreen,'dex');shopScreen=wrapS(shopScreen,'shop');centerScreen=wrapS(centerScreen,'center');parentsScreen=wrapS(parentsScreen,'parents');
ACT.title=titleScreen;ACT.map=mapScreen;ACT.team=teamScreen;ACT.dex=dexScreen;ACT.shop=shopScreen;ACT.center=centerScreen;

window.__zahlimon={GEN,MK,aidHTML,get S(){return S},set S(v){S=v},get B(){return B},fresh};
titleScreen();
})();
</script>
</body>
</html>
