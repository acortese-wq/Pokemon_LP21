<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zahlongus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: Vollbild-Raumschiff (Canvas) von oben, HUD oben, Joystick links, Aktionsknöpfe rechts; Tafeln als Raumschiff-Konsolen */
:root{
  color-scheme: dark;
  --space:#070b18; --hull:#151c33; --panel:#18213d; --panel2:#222d52; --line:#3b4c86; --ink:#eef3ff; --ink2:#a9b6dc;
  --cyan:#3fe0ff; --green:#45d17a; --red:#ff4d5e; --gold:#ffd447; --violet:#a07bff;
  --f-head:'Chakra Petch','Atkinson Hyperlegible',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--space);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#game{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(10,15,35,.78);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:700 .85rem var(--f-head);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tbar{flex:1;min-width:140px;max-width:420px;height:20px;background:#0b1024;border:2px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fbf6b,#7cff9e)}
.tbar span{position:relative;display:block;text-align:center;font:700 .78rem/16px var(--f-head)}
.role{font:700 .85rem var(--f-head);padding:4px 10px;border-radius:8px}
.role.crew{background:#1d6fb8}.role.imp{background:#b8233a}
/* Aufgabenfeld: einklappbar, eingeklappt bleibt eine kompakte Zusammenfassung sichtbar */
#tasks{pointer-events:auto;align-self:flex-start;background:rgba(10,15,35,.84);border:1px solid var(--line);border-radius:12px;width:min(300px,64vw);overflow:hidden;transition:width .22s ease,box-shadow .3s}
#tasks.closed{width:auto;max-width:min(300px,64vw)}
#tasks .th{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;background:none;border:0;color:#fff;font:700 .88rem var(--f-head);text-align:left}
#tasks .th:active{background:rgba(255,255,255,.06)}
#tasks .th>span:first-child{white-space:nowrap;flex:none}
@media (max-width:420px){#tasks.closed .pips{display:none}}
#tasks .tsum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font:400 .8rem var(--f-body);color:var(--ink2)}
#tasks:not(.closed) .tsum{display:none}
.pips{display:flex;gap:3px;flex:none}.pips i{width:9px;height:9px;border-radius:50%;background:#2c3866;border:1px solid #4a5a96}.pips i.on{background:var(--green);border-color:#7cff9e}.pips i.half{background:linear-gradient(90deg,var(--gold) 50%,#2c3866 50%)}
#tasks .chev{margin-left:auto;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);transition:transform .22s ease}
#tasks.closed .chev{transform:rotate(-90deg)}
#tasks .tb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
#tasks.closed .tb{grid-template-rows:0fr}
#tasks .tb>div{overflow:hidden;min-height:0}
#tasks .tl{padding:0 6px 6px;display:flex;flex-direction:column;gap:2px}
#tasks .t{display:flex;gap:6px;align-items:center;width:100%;min-height:36px;padding:4px 6px;border-radius:8px;background:none;border:1px solid transparent;color:#fff;font:400 .82rem/1.25 var(--f-body);text-align:left}
#tasks button.t:active{background:rgba(255,255,255,.06)}
#tasks .t.sel{background:rgba(255,212,71,.14);border-color:#ffd447}
#tasks .t .ti{font-family:var(--f-emoji);flex:none}
#tasks .t .tr{color:var(--ink2);font-size:.75rem}
#tasks .t .tp{margin-left:auto;flex:none;font:700 .75rem var(--f-head);color:var(--gold)}
#tasks .t.done{color:#7cff9e;opacity:.75}#tasks .t.done .tn{text-decoration:line-through}
#tasks .thint{font-size:.72rem;color:var(--ink2);padding:2px 6px 0}
#tasks.flash{animation:tflash .9s ease-out}
@keyframes tflash{25%{box-shadow:0 0 0 3px var(--green),0 0 18px var(--green)}}
.banner{background:#b8233a;color:#fff;font:700 .9rem var(--f-head);padding:5px 10px;border-radius:8px;animation:pulse 1s ease-in-out infinite;pointer-events:none;align-self:center}
@keyframes pulse{50%{opacity:.6}}
#acts{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ab{min-width:88px;min-height:72px;border-radius:16px;border:3px solid rgba(255,255,255,.7);background:rgba(20,30,60,.85);color:#fff;font:700 .95rem var(--f-head);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px}
.ab span{font-family:var(--f-emoji);font-size:1.6rem;line-height:1}
.ab.use{background:#1d6fb8}.ab.rep{background:#c2410c}.ab.frz{background:#2a8fb3}.ab.sab{background:#7b2cbf}.ab.emg{background:#b8233a}
.ab:disabled{opacity:.4}
.ab small{font:700 .72rem var(--f-body)}
#modal,#screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(3,6,15,.72);overflow:auto}
#screen{z-index:40;background:radial-gradient(ellipse at 50% 20%,#1a2350,#070b18 70%);align-items:flex-start}
.panel{width:min(500px,100%);margin:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;box-shadow:0 0 0 4px #0b1024,0 12px 40px rgba(0,0,0,.6);padding:16px;max-height:100%;overflow:auto}
.panel h2{font:700 1.4rem var(--f-head);margin:0 0 8px;letter-spacing:.02em;text-wrap:balance}
.panel h3{font:700 1.05rem var(--f-head);margin:14px 0 6px;color:var(--cyan)}
.fine{font-size:.86rem;color:var(--ink2);margin:4px 0 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:8px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:#fff;font:700 1.05rem var(--f-head)}
.btn.go{background:#1f9d55;border-color:#5cf09a}.btn.red{background:#b8233a;border-color:#ff8090}.btn.blue{background:#1d6fb8;border-color:#7cc4ff}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{width:100%;font:700 1.2rem var(--f-body);padding:10px;border-radius:10px;border:2px solid var(--line);background:#0b1024;color:#fff}
/* Aufgabe */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtitle{font:700 1.05rem var(--f-head)}
.steps{display:flex;gap:6px;margin-top:6px}.steps i{width:22px;height:8px;border-radius:4px;background:#2c3866}.steps i.on{background:var(--green)}
.tipb{border:2px solid #ffe28a;background:#7a5a00;color:#fff;border-radius:10px;font:700 .85rem var(--f-head);padding:5px 9px;flex:none}
.blitzw{display:flex;align-items:center;gap:6px;margin-top:8px}.blitzl{font:700 .75rem var(--f-head);color:var(--gold)}
.blitz{flex:1;height:8px;background:#0b1024;border-radius:4px;overflow:hidden;position:relative}
.blitz i{position:absolute;inset:0;background:linear-gradient(90deg,#ff9d00,#ffe066);transform-origin:left;animation:blitz linear forwards}
@keyframes blitz{to{transform:scaleX(0)}}
.qt{margin:10px 0 6px;font:700 1.9rem var(--f-body);text-align:center;overflow-wrap:anywhere}
.qt.long{font-size:1.1rem;text-align:left}
.qvis{display:flex;justify-content:center;color:#222;background:#fff;border-radius:10px;padding:4px}
.entry{display:flex;justify-content:center;min-height:50px;margin:4px 0}
.entry span{width:40px;height:50px;display:grid;place-items:center;font:700 1.9rem var(--f-body);background:#0b1024;border:2px solid var(--cyan);margin-left:-2px;color:var(--cyan)}
.entry .cur{animation:blink 1s steps(2) infinite}@keyframes blink{50%{background:#1b2650}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.kp button{height:54px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font:700 1.6rem var(--f-body);color:#fff}
.kp button:active{background:#33417a}.kp .ok{background:#1f9d55;border-color:#5cf09a}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.ch.c3{grid-template-columns:repeat(3,1fr)}
.chb{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font:700 1.4rem var(--f-body);color:#fff}.ch.c3 .chb{font-size:2rem}
.fbh{font:700 1.3rem var(--f-head);color:var(--red);margin:0}
.bigans{font:700 1.5rem var(--f-body);color:#7cff9e}
.hint{background:#2b2a12;border:2px solid #8a7a20;border-radius:10px;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}
.aid{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px 0;background:#fff;border-radius:10px;padding:6px;color:#222}
.aid svg{max-width:100%;height:auto;overflow:visible}.aid .cap{font-size:.85rem;font-weight:700;color:#555}
.arc{fill:none;stroke:#2a66cc;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fadeIn .35s ease-out forwards}@keyframes fadeIn{to{opacity:1}}
.pp{transform-box:fill-box;transform-origin:center;animation:pop2 .35s cubic-bezier(.3,1.6,.6,1) both}@keyframes pop2{from{transform:scale(0)}}
.fly{animation:flyin .45s ease-out both}@keyframes flyin{from{transform:translate(var(--dx),var(--dy));opacity:0}}
.drop{animation:dropIn .7s cubic-bezier(.3,1.6,.6,1) both}@keyframes dropIn{from{transform:translateY(-40px);opacity:0}}
.hand{transform-origin:60px 60px;transform:rotate(var(--a));animation:handspin 1.3s cubic-bezier(.2,.8,.3,1) both}@keyframes handspin{from{transform:rotate(calc(var(--a) - 360deg))}}
.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* Besprechung */
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.msg{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;animation:fadeIn .3s ease-out both}
.msg canvas{width:40px;height:40px}
.msg .b{background:#0f1630;border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.msg .b b{font-family:var(--f-head);font-size:.85rem}
.msg.sys .b{background:#3a1520;border-color:#ff8090}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.vb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:#fff;font:700 .95rem var(--f-head);text-align:left;min-height:56px}
.vb canvas{width:40px;height:40px;flex:none}
.vb.dead{opacity:.35}.vb.sel{border-color:var(--gold);background:#4a3b05}
.vb .vc{margin-left:auto;font-family:var(--f-emoji)}
/* Titel, Garderobe */
.logo{font:700 clamp(2.6rem,13vw,4.4rem)/1 var(--f-head);text-align:center;margin:5vh 0 2px;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#7fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #1d2a66)}
.sub{text-align:center;color:var(--cyan);font:700 1rem var(--f-head);margin:0 0 14px}
.wrap{width:min(500px,100%);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.preview{display:flex;justify-content:center}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.cs{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:#fff;font:700 .72rem var(--f-body);position:relative;overflow:hidden}
.cs::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.cs img{width:44px;height:44px}.cs.on{border-color:var(--gold);background:#4a3b05;box-shadow:0 0 0 2px var(--gold)}
.hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.hb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:#fff;font-weight:700;font-size:.8rem}
.hb .e{font-family:var(--f-emoji);font-size:1.8rem;line-height:1.1;min-height:2rem}
.hb.on{border-color:var(--gold);background:#4a3b05}.hb.lock{opacity:.6}.hb.can{opacity:1;border-color:#5cf09a;border-style:dashed}
.hcat{font:700 .9rem var(--f-head);color:var(--ink2);margin:12px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpis div{background:#0f1630;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}.kpis b{font:700 1.4rem var(--f-head)}.kpis span{font-size:.75rem;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl th,.tbl td{padding:5px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.rowx select{font:inherit;padding:4px;background:#0b1024;color:#fff;border:1px solid var(--line);border-radius:6px}
.reveal{text-align:center;padding:30px 10px}
.reveal h1{font:700 clamp(2.2rem,10vw,3.6rem) var(--f-head);margin:10px 0}
#toast{position:fixed;left:50%;top:max(calc(80px + env(safe-area-inset-top,0px)),30vh);transform:translateX(-50%);z-index:70;max-width:min(440px,calc(100% - 32px));background:rgba(10,15,35,.92);border:2px solid var(--cyan);border-radius:10px;padding:8px 14px;font:700 .95rem var(--f-head);text-align:center;pointer-events:none}
.float{position:fixed;z-index:65;transform:translate(-50%,-50%);font:700 1.2rem var(--f-head);color:#7cff9e;text-shadow:0 2px 0 #000;pointer-events:none;animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.arc{stroke-dashoffset:0}.fi{opacity:1}}
</style>
</head>
<body>
<div id="game"><canvas id="cv" aria-label="Raumschiff"></canvas><div id="hud"><div id="hudTop"></div><div id="tasks" hidden></div></div><div id="acts"></div></div>
<div id="modal" hidden></div>
<div id="screen" hidden></div>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
/* =========================================================
   Zahlongus – Rechen-Raumschiff, Mathematik 3. Klasse (LP21)
   ========================================================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad2=n=>String(n).padStart(2,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP_VERSION='2026-11-11z6';
const KEY='zahlongus_v1';
let S=null;

/* ---------- Aufgaben (LP21 Mathematik, 3. Klasse) ---------- */
function parts(b){return [Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean)}
function jumpsAdd(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=(10-d)*u;if(d>0&&p>f){j.push(f,p-f);c+=p;continue}}j.push(p);c+=p}return j}
function jumpsSub(a,b){let c=a;const j=[];for(const p of parts(b)){const u=p>=100?100:p>=10?10:1;if(u<100){const d=Math.floor(c/u)%10,f=d*u;if(d>0&&p>f){j.push(f,p-f);c-=p;continue}}j.push(p);c-=p}return j}
function hintAdd(a,b){const j=jumpsAdd(a,b);if(b<10&&a>=10&&j.length===1)return `Rechne die Einer: ${a%10} + ${b} = ${a%10+b}  →  ${a+b}`;let c=a;return j.map(x=>`${c} + ${x} = ${c+=x}`).join('  →  ')}
function hintSub(a,b){const j=jumpsSub(a,b);if(b<10&&a>=10&&j.length===1&&a%10>=b)return `Rechne die Einer: ${a%10} − ${b} = ${a%10-b}  →  ${a-b}`;let c=a;return j.map(x=>`${c} − ${x} = ${c-=x}`).join('  →  ')}
const LA=(a,b)=>({t:'line',start:a,jumps:jumpsAdd(a,b)}),LS=(a,b)=>({t:'line',start:a,jumps:jumpsSub(a,b).map(x=>-x)});
function hintMal(f,b){
  if(f===1)return `1 · ${b} = ${b}`;
  if(f===10)return `10 · ${b} = ${10*b} (eine Null anhängen)`;
  if(f===2)return `Verdoppeln: ${b} + ${b} = ${2*b}`;
  if(f===5)return `10 · ${b} = ${10*b}. Die Hälfte davon ist ${5*b}.`;
  if(f===9)return `10 · ${b} = ${10*b}, dann einmal ${b} weg: ${10*b} − ${b} = ${9*b}`;
  if(f>5)return `5 · ${b} = ${5*b} und ${f-5} · ${b} = ${(f-5)*b}  →  ${5*b} + ${(f-5)*b} = ${f*b}`;
  return `In ${b}er-Schritten: `+Array.from({length:f},(_,i)=>(i+1)*b).join(', ')}
function halbHint(a){const t=Math.floor(a/10)*10,e=a-t;return e?`Die Hälfte von ${t} ist ${t/2}, die Hälfte von ${e} ist ${e/2}  →  ${a/2}`:`${a} : 2 = ${a/2}`}
function cmpQ(a,b){const s=a<b?'<':a>b?'>':'=';return {text:`${a} □ ${b}`,say:`Was passt? ${a} ist kleiner, grösser oder gleich ${b}?`,kind:'choice',choices:['<','=','>'],ans:s,hint:`${a} ${s} ${b}. Vergleiche zuerst die grösste Stelle, dann die nächste.`}}
const fmtCHF=rp=>{const f=Math.floor(rp/100),r=rp%100;return f&&r?`${f} Fr. ${r} Rp.`:f?`${f} Fr.`:`${r} Rp.`};
const fmtT=(h,m)=>`${h}.${pad2(m)} Uhr`;
function clockSVG(h,m){const rad=d=>d*Math.PI/180,X=(r,a)=>(60+r*Math.sin(rad(a))).toFixed(1),Y=(r,a)=>(60-r*Math.cos(rad(a))).toFixed(1);
  let s='<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Uhr"><circle cx="60" cy="60" r="56" fill="#fff" stroke="currentColor" stroke-width="4"/>';
  for(let i=0;i<60;i++){const a=i*6,r1=i%5?50:45;s+=`<line x1="${X(r1,a)}" y1="${Y(r1,a)}" x2="${X(53,a)}" y2="${Y(53,a)}" stroke="currentColor" stroke-width="${i%5?1:2.5}"/>`}
  for(let i=1;i<=12;i++){const a=i*30;s+=`<text x="${X(36,a)}" y="${(60-36*Math.cos(rad(a))+5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="sans-serif">${i}</text>`}
  const ha=((h%12)+m/60)*30,ma=m*6;
  s+=`<g class="hand" style="--a:${ha}deg"><line x1="60" y1="60" x2="60" y2="34" stroke="#d9443a" stroke-width="6" stroke-linecap="round"/></g>`;

function drawChar(g,x,y,sz,col,hat,o){o=o||{};const face=o.face||1,step=o.step||0;g.save();g.translate(x,y);if(o.alpha!=null)g.globalAlpha=o.alpha;
  const w=sz*.62,h=sz*.62;const lg=Math.sin(step)*sz*.06;
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,h*.62,w*.55,h*.14,0,0,7);g.fill();
  g.fillStyle=shade(col,-.35);g.fillRect(-w*.32,h*.25+lg,w*.24,h*.32);g.fillRect(w*.08,h*.25-lg,w*.24,h*.32);
  g.fillStyle=col;rr(g,-w*.45,-h*.05,w*.9,h*.5,w*.18);g.fill();g.fillStyle=shade(col,-.2);g.fillRect(face>0?-w*.55:w*.42,h*.02,w*.13,h*.32);
  g.fillStyle='rgba(255,255,255,.18)';g.fillRect(-w*.3,h*.05,w*.18,h*.25);
  /* Helm in Spielerfarbe mit breitem, spiegelndem Visier (schaut in Laufrichtung) */
  g.fillStyle=col;g.strokeStyle=shade(col,-.45);g.lineWidth=Math.max(1.5,sz*.035);g.beginPath();g.arc(0,-h*.32,w*.42,0,7);g.fill();g.stroke();
  g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.arc(-w*.12,-h*.44,w*.2,0,7);g.fill();
  {const vw=w*.68,vh=h*.32,vx=face*w*.09-vw/2,vy=-h*.35-vh/2,vg=g.createLinearGradient(0,vy,0,vy+vh);vg.addColorStop(0,'#d4f6ff');vg.addColorStop(.45,'#7cc8e6');vg.addColorStop(1,'#2d6b92');
   g.fillStyle=vg;g.strokeStyle='#14263a';g.lineWidth=Math.max(1.5,sz*.03);rr(g,vx,vy,vw,vh,vh/2);g.fill();g.stroke();
   g.fillStyle='rgba(255,255,255,.9)';rr(g,vx+vw*(face>0?.52:.14),vy+vh*.18,vw*.3,vh*.24,vh*.12);g.fill();
   g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(vx+vw*(face>0?.42:.5),vy+vh*.3,vh*.08,0,7);g.fill()}
  g.strokeStyle=shade(col,-.3);g.beginPath();g.moveTo(0,-h*.74);g.lineTo(0,-h*.9);g.stroke();g.fillStyle=col;g.beginPath();g.arc(0,-h*.92,sz*.04,0,7);g.fill();
  if(hat){g.font=`${sz*.42}px ${'Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif'}`;g.textAlign='center';g.textBaseline='middle';g.fillText(hat,0,-h*.86)}
  if(o.frozen){g.fillStyle='rgba(170,230,255,.55)';g.strokeStyle='#e6f8ff';g.lineWidth=2;rr(g,-w*.62,-h*1.0,w*1.24,h*1.62,6);g.fill();g.stroke();g.font=`${sz*.3}px sans-serif`;g.textAlign='center';g.fillText('❄️',w*.38,-h*.72)}
  g.restore()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return `rgb(${r},${g},${b})`}
function avatar(ci,hat,frozen){const c=document.createElement('canvas');c.width=c.height=80;const g=c.getContext('2d');drawChar(g,40,46,70,COLORS[ci][1],hat,{frozen});return c}
function avatarHTML(ci,hat,frozen){try{return `<img src="${avatar(ci,hat,frozen).toDataURL()}" width="40" height="40" alt="">`}catch(e){return ''}}

/* ---------- Spielrunde ---------- */
const TASKS_PER=6;let G=null;const keys={L:0,R:0,U:0,D:0};let joy=null;
const VIEW=6.2,REPORT_R=2.6,USE_R=1.5,FRZ_R=1.6;
const BOT_NAMES=['Kiki','Bo','Mila','Tom','Nora','Leo','Ivy','Max'];
function newRound(){const roleSet=S.settings.role,imp=roleSet==='imp'?true:roleSet==='crew'?false:Math.random()<.3;
  const free=shuffle(COLORS.map((c,i)=>i).filter(i=>i!==S.color)).slice(0,5),hatsFree=shuffle(HATS.map(h=>h[0]).filter(Boolean));
  const chars=[{id:0,ci:S.color,hat:S.hat,name:S.name,player:true}].concat(free.map((ci,i)=>({id:i+1,ci,hat:Math.random()<.5?hatsFree[i]:'',name:COLORS[ci][0]})));
  const impId=imp?0:R(1,5);const bx=30.5,by=19.5;
  chars.forEach((c,i)=>{const a=i/chars.length*Math.PI*2;Object.assign(c,{x:bx+Math.cos(a)*2.6,y:by+Math.sin(a)*2.6,imp:c.id===impId,alive:true,ghost:false,path:[],state:'idle',workT:0,face:1,step:0,tasks:[],done:0,cool:22,emerg:1,claim:null});
    if(!c.imp)c.tasks=shuffle(TASKST.slice()).slice(0,TASKS_PER).map(s=>({id:s.id,prog:0,done:false}))});
  G={t:0,chars,impId,player:chars[0],bodies:[],hist:[],lights:false,lightsT:0,sabCool:40,meeting:false,over:false,earned:0,totalTasks:chars.filter(c=>!c.imp).length*TASKS_PER,doneTasks:0,lastHist:0,lastEvent:null};
  closeScreen();closeModal();sfx('alarm');
  openScreen(`<div class="wrap reveal"><p class="fine">Deine Rolle in dieser Runde:</p><h1 style="color:${imp?'var(--red)':'var(--cyan)'}">${imp?'VERRÄTER':'CREW'}</h1><div class="preview">${avatarHTML(S.color,S.hat)}</div>
  <div class="panel" style="text-align:left">${imp?'<b>Du bist der Verräter!</b> Friere die Crew mit der Frostkanone ❄️ ein, ohne dass dich jemand sieht. Jeder Schuss braucht eine richtige Rechnung. Du kannst auch das Licht ausschalten. Gewinne, bevor die Crew alle Aufgaben erledigt!':'<b>Du bist in der Crew!</b> Löse deine 6 Aufgaben an den gelben Stationen (je 3 Rechnungen). Unter euch ist ein Verräter, der Leute einfriert. Findest du jemanden, melde es und stimme ab, wer es war!'}</div>
  <button class="btn go" data-act="startRound">Los geht's!</button></div>`)}
ACT.startRound=()=>{closeScreen();G.target=G.player.imp?null:nearestTask();toast(G.player.imp?'❄️ Friere heimlich die Crew ein!':'📋 Löse deine Aufgaben! Der gelbe Pfeil zeigt dir den Weg.')};
ACT.play=()=>{newRound()};

function update(dt){if(!G||G.over)return;G.t+=dt;const p=G.player;
  let vx=(keys.R-keys.L),vy=(keys.D-keys.U);if(joy&&joy.active){vx=joy.dx;vy=joy.dy}const l=Math.hypot(vx,vy);if(l>1){vx/=l;vy/=l}
  const sp=(p.ghost?4.6:4)*dt;moveC(p,vx*sp,vy*sp,p.ghost);if(Math.abs(vx)>.1)p.face=Math.sign(vx);p.step=l>.1?p.step+dt*12:0;
  for(const c of G.chars)if(!c.player)botUpdate(c,dt);
  if(G.lights){G.lightsT+=dt;if(G.lightsT>32&&!p.imp){G.lights=false;toast('💡 Die Crew hat das Licht repariert.')}else if(G.lightsT>32){G.lights=false}}
  G.sabCool=Math.max(0,G.sabCool-dt);for(const c of G.chars)c.cool=Math.max(0,c.cool-dt);
  if(G.t-G.lastHist>=1){G.lastHist=G.t;const snap={t:G.t,r:{}};for(const c of G.chars)if(c.alive)snap.r[c.id]=roomOf(c.x,c.y);G.hist.push(snap);if(G.hist.length>90)G.hist.shift()}
  checkEnd()}
function moveC(c,dx,dy,ghost){const r=.28;const ok=(x,y)=>ghost?x>1&&y>1&&x<MW-1&&y<MH-1:walk(x-r,y-r)&&walk(x+r,y-r)&&walk(x-r,y+r)&&walk(x+r,y+r);if(ok(c.x+dx,c.y))c.x+=dx;if(ok(c.x,c.y+dy))c.y+=dy}
function goTo(c,x,y){c.path=bfs(c.x,c.y,x,y);c.state='walk'}
function followPath(c,dt,speed){const n=c.path[0];if(!n){c.state='idle';return}const dx=n.x-c.x,dy=n.y-c.y,d=Math.hypot(dx,dy);if(d<.12){c.path.shift();return}const s=Math.min(d,speed*dt);c.x+=dx/d*s;c.y+=dy/d*s;if(Math.abs(dx)>.05)c.face=Math.sign(dx);c.step+=dt*11}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const roomAt=(id,t)=>{let best=null;for(const h of G.hist){if(h.t<=t+.01)best=h;else break}return best?best.r[id]:null};
function botUpdate(c,dt){if(!c.alive&&!c.ghost)return;const speed=c.ghost?2.6:3.1;
  if(c.imp&&c.alive){impostorBot(c,dt,speed);return}
  if(c.alive&&!G.meeting){for(const b of G.bodies){if(!b.reported&&dist(c,b)<4&&roomOf(c.x,c.y)===b.room){b.reported=true;setTimeout(()=>startMeeting(c,b),400);return}}}
  if(c.state==='walk'){followPath(c,dt,speed);if(!c.path.length){c.state='work';c.workT=(G.player.imp?13:9)+Math.random()*4}}
  else if(c.state==='work'){c.workT-=dt;if(c.workT<=0){const t=c.tasks.find(t=>t.id===c.target&&!t.done);if(t){t.done=true;G.doneTasks++}c.state='idle'}}
  else{const open=c.tasks.filter(t=>!t.done);let st;if(open.length){const t=P(open);st=stById(t.id);c.target=t.id}else{st=P(ST);c.target=null}goTo(c,st.x+.5+(Math.random()-.5),st.y+.5+(Math.random()-.5)*.5)}}
function impostorBot(c,dt,speed){
  if(!G.player.imp&&!G.lights&&G.sabCool<=0&&G.t>50&&Math.random()<dt/25){G.lights=true;G.lightsT=0;G.sabCool=70;sfx('alarm');toast('⚠️ Licht aus! Repariere den Stromkasten ⚡ im Reaktor.')}
  if(c.cool<=0&&G.t>25){const room=roomOf(c.x,c.y);const others=G.chars.filter(o=>o.alive&&o!==c&&!o.imp);
    for(const v of others){if(dist(c,v)<1.6&&roomOf(v.x,v.y)===room){const witnesses=others.filter(o=>o!==v&&dist(o,c)<(G.lights?3:VIEW+.5));if(!witnesses.length){freeze(c,v);return}}}}
  if(c.state==='walk'){followPath(c,dt,speed+.2);if(c.hunt&&c.hunt.alive&&Math.random()<dt*1.2){goTo(c,c.hunt.x,c.hunt.y)}}
  else{c.workT-=dt;if(c.workT<=0){if(c.cool<6&&Math.random()<.7){const prey=P(G.chars.filter(o=>o.alive&&!o.imp));c.hunt=prey;if(prey)goTo(c,prey.x,prey.y)}else{c.hunt=null;const st=P(ST);goTo(c,st.x+.5,st.y+.5)}c.workT=R(2,5)}}}
function freeze(by,v){v.alive=false;v.ghost=!v.player;by.cool=v.player?30:28;sfx('frz');const b={id:v.id,ci:v.ci,hat:v.hat,x:v.x,y:v.y,room:roomOf(v.x,v.y),t:G.t,by:by.id,reported:false};G.bodies.push(b);G.lastEvent=b;
  if(v.player){v.ghost=true;setTimeout(()=>{if(!G||G.over)return;openModal(`<h2>❄️ Du wurdest eingefroren!</h2><p>Der Verräter hat dich erwischt. Als Geist 👻 schwebst du jetzt durch die Wände.</p><p><b>Du kannst trotzdem helfen:</b> Löse weiter deine Aufgaben, dann gewinnt die Crew vielleicht doch noch!</p><button class="btn go" data-act="close">Weiter</button>`)},300)}
  if(by.player){const wit=G.chars.filter(o=>o.alive&&!o.player&&dist(o,by)<(G.lights?3:VIEW)&&roomOf(o.x,o.y)===roomOf(by.x,by.y));if(wit.length){b.witness=wit[0].id;b.reported=true;setTimeout(()=>startMeeting(wit[0],b),700)}}}
ACT.close=()=>closeModal();

/* ---------- Aktionen des Spielers ---------- */
const nearSt=()=>{const p=G.player;let best=null,bd=9;for(const s of ST){const d=Math.hypot(s.x+.5-p.x,s.y+.5-p.y);if(d<USE_R&&d<bd){bd=d;best=s}}return best};
const nearBody=()=>G.bodies.find(b=>!b.reported&&dist(b,G.player)<REPORT_R);
const nearVictim=()=>G.chars.find(c=>c.alive&&!c.player&&dist(c,G.player)<FRZ_R);
const myTask=id=>G.player.tasks.find(t=>t.id===id&&!t.done);
function doUse(){if(!G||G.meeting||G.over||Q)return;const p=G.player,s=nearSt();if(!s)return;
  if(s.special==='emergency'){if(p.ghost)return toast('Geister können keine Besprechung einberufen.');if(!p.emerg)return toast('Du hast deinen Notfall-Knopf schon benutzt.');p.emerg=0;startMeeting(p,null);return}
  if(s.special==='lights'){if(!G.lights)return toast('Das Licht funktioniert. Alles in Ordnung.');if(p.imp)return toast('Als Verräter lässt du das Licht lieber aus. 😉');lightsTask(0);return}
  if(s.special==='cams'){camsTask(0);return}
  if(p.imp)return toast('Du tust so, als würdest du arbeiten … 😉');
  const t=myTask(s.id);if(!t)return toast(p.tasks.find(t=>t.id===s.id)?'Diese Aufgabe hast du schon erledigt.':'Das ist nicht deine Aufgabe. Schau in deine Liste!');doTask(s,t)}
function doTask(s,t){ask(nextQ(s.topic),{title:`${s.ic} ${s.n}`,steps:[t.prog,3],onOk:()=>{t.prog++;if(t.prog>=3){t.done=true;G.doneTasks++;S.tasks++;S.stars+=2;save();sfx('task');toast(`✅ ${s.n} erledigt! +2 ⭐`);if(G.target===s.id)G.target=nearestTask();flashTasks();checkEnd()}else setTimeout(()=>{if(G&&!G.meeting&&!G.over&&nearSt()===s)doTask(s,t)},350)},onFail:()=>setTimeout(()=>{if(G&&!G.meeting&&!G.over)doTask(s,t)},200)})}
function lightsTask(n){ask(nextQ('add'),{title:'⚡ Stromkasten reparieren',steps:[n,2],onOk:()=>{if(n+1>=2){G.lights=false;toast('💡 Licht repariert!');sfx('task')}else setTimeout(()=>lightsTask(n+1),300)},onFail:()=>setTimeout(()=>lightsTask(n),200)})}
function camsTask(n){ask(nextQ('mix'),{title:'📹 Kameras einschalten',steps:[n,2],onOk:()=>{if(n+1>=2)showCams();else setTimeout(()=>camsTask(n+1),300)},onFail:()=>setTimeout(()=>camsTask(n),200)})}
function showCams(){const since=G.t-30,seen={};for(const h of G.hist){if(h.t<since)continue;for(const id in h.r){const r=h.r[id];if(r==='gang')continue;(seen[r]=seen[r]||new Set()).add(+id)}}
  openModal(`<h2>📹 Kameras: die letzten 30 Sekunden</h2><p class="fine">Wer war in welchem Raum?</p>${ROOMS.map(r=>`<div class="rowx"><span>${r.n}</span><span>${seen[r.id]?[...seen[r.id]].map(id=>{const c=G.chars[id];return avatarHTML(c.ci,c.hat,!c.alive)}).join(''):'<span class="fine">niemand</span>'}</span></div>`).join('')}<button class="btn go" data-act="close">Schliessen</button>`)}
function doReport(){if(!G||G.meeting||G.over||Q)return;const b=nearBody();if(!b)return;if(G.player.ghost)return toast('Geister können nichts melden.');b.reported=true;startMeeting(G.player,b)}
function doFreeze(){if(!G||G.meeting||G.over||Q)return;const p=G.player;if(!p.imp)return;const v=nearVictim();if(!v)return toast('Niemand ist nah genug.');if(p.cool>0)return toast(`Die Frostkanone lädt noch (${Math.ceil(p.cool)} s).`);
  ask(nextQ('mix'),{title:`❄️ Frostkanone auf ${v.name} laden`,onOk:fast=>{if(!v.alive)return;if(dist(v,p)>FRZ_R+1.2)return toast(`${v.name} ist zu weit weg.`);freeze(p,v);toast(`❄️ ${v.name} ist eingefroren!`);checkEnd()},onFail:()=>{p.cool=8;toast('Die Frostkanone klemmt! Warte kurz.')}})}
function doSabotage(){if(!G||!G.player.imp||G.meeting||G.over||Q)return;if(G.lights)return toast('Das Licht ist schon aus.');if(G.sabCool>0)return toast(`Sabotage lädt noch (${Math.ceil(G.sabCool)} s).`);
  ask(nextQ('mix'),{title:'💡 Licht ausschalten',onOk:()=>{G.lights=true;G.lightsT=0;G.sabCool=60;sfx('alarm');toast('Licht aus! Die Crew sieht jetzt fast nichts.')}})}
ACT.use=doUse;ACT.report=doReport;ACT.freeze=doFreeze;ACT.sab=doSabotage;

/* ---------- Besprechung ---------- */
function startMeeting(caller,body){if(!G||G.meeting||G.over)return;G.meeting=true;closeModal();toastEl.hidden=true;sfx('alarm');keys.L=keys.R=keys.U=keys.D=0;if(joy)joy.active=false;
  const tm=G.t,lines=[],alive=G.chars.filter(c=>c.alive),imp=G.chars[G.impId],nm=c=>c.player?`${c.name} (du)`:c.name;
  if(body){const v=G.chars[body.id];lines.push({c:caller,t:caller.player?`Ich habe ${v.name} im Raum «${rName(body.room)}» gefunden. Eingefroren!`:`Ich habe ${nm(v)} im Raum «${rName(body.room)}» gefunden. Eingefroren!`});
    if(body.witness!=null){const w=G.chars[body.witness];lines.push({c:w,t:`Ich habe es gesehen! ${nm(G.chars[body.by])} hat ${nm(v)} eingefroren!`,acc:body.by,strong:1})}}
  else lines.push({c:caller,t:caller.player?'Ich habe eine Notfall-Besprechung einberufen!':`Ich habe den Notfall-Knopf gedrückt. Mir kommt etwas komisch vor.`});
  G.meet={tm,body,lines,caller,claims:{}};
  if(G.player.imp&&G.player.alive){openScreen(`<div class="wrap"><div class="panel"><h2>🚨 Besprechung</h2>${chatHTML(lines)}<h3>Wo sagst du, warst du gerade?</h3><p class="fine">Du darfst schwindeln. Aber Achtung: Wer selbst in dem Raum war, merkt es vielleicht!</p>
    <div class="row2">${ROOMS.map(r=>`<button class="btn" data-act="claim" data-arg="${r.id}">${r.n}</button>`).join('')}</div></div></div>`);return}
  buildStatements()}
ACT.claim=id=>{G.meet.claims[0]=id;G.meet.lines.push({c:G.player,t:`Ich war im Raum «${rName(id)}».`});buildStatements()};
function buildStatements(){const M=G.meet,tm=M.tm,body=M.body,lines=M.lines,imp=G.chars[G.impId],nm=c=>c.player?`${c.name} (du)`:c.name;
  const bots=shuffle(G.chars.filter(c=>c.alive&&!c.player));
  for(const b of bots){if(b.imp){let claim;const real=roomAt(b.id,tm-4);if(body&&Math.random()<.85){claim=P(ROOMS.filter(r=>r.id!==body.room).map(r=>r.id))}else claim=real&&real!=='gang'?real:P(ROOMS).id;M.claims[b.id]=claim;lines.push({c:b,t:`Ich war im Raum «${rName(claim)}». Ich habe nichts gesehen.`});

  <div class="panel"><p style="margin:0">Hallo <b>${esc(S.name)}</b>! ⭐ ${S.stars} Sterne · heute ${minToday()} Rechenminuten <span class="fine">(zählen auch für Zahlcraft)</span></p>
  <label class="rowx" for="roleSel"><span>Rolle</span><select id="roleSel"><option value="random" ${S.settings.role==='random'?'selected':''}>Zufall</option><option value="crew" ${S.settings.role==='crew'?'selected':''}>Immer Crew</option><option value="imp" ${S.settings.role==='imp'?'selected':''}>Immer Verräter</option></select></label>
  <button class="btn go" data-act="play">🚀 Spielen</button><div class="row2"><button class="btn" data-act="wardrobe">👕 Garderobe</button><button class="btn" data-act="howto">❓ So geht's</button></div>
  <button class="btn" data-act="parents">Für Eltern</button></div><p class="fine" style="text-align:center"><a href="../" style="color:var(--cyan)">Zahlcraft</a> · <a href="../zahlimon/" style="color:var(--cyan)">Zahlimon</a> · Version ${APP_VERSION}</p></div>`);
  $('#roleSel').addEventListener('change',e=>{S.settings.role=e.target.value;save()})}
ACT.home=home;
ACT.howto=()=>openScreen(`<div class="wrap"><div class="panel"><h2>❓ So geht's</h2>
  <p>🕹️ <b>Bewegen:</b> Finger auf den Bildschirm legen und ziehen (am Computer: Pfeiltasten oder WASD).</p>
  <p>🧑‍🚀 <b>Crew:</b> Gehe zu den gelben <b>!</b>-Stationen und tippe auf «Benutzen». Jede Aufgabe hat 3 Rechnungen. Wenn alle Aufgaben erledigt sind, gewinnt die Crew.</p>
  <p>❄️ <b>Verräter:</b> Er friert Leute ein. Findest du jemanden im Eis, tippe auf «Melden». In der Besprechung erzählt jeder, wo er war. Achte darauf, wer schwindelt! Dann stimmt ihr ab.</p>
  <p>📹 <b>Tipp:</b> In der Überwachung kannst du nach 2 Rechnungen sehen, wer in den letzten 30 Sekunden wo war.</p>
  <p>😈 <b>Bist du der Verräter:</b> Stell dich neben jemanden, der allein ist, und tippe auf «Einfrieren». Die Frostkanone braucht eine richtige Rechnung. Lass dich nicht erwischen!</p>
  <button class="btn go" data-act="home">Zurück</button></div></div>`);
ACT.wardrobe=()=>{openScreen(`<div class="wrap"><div class="panel"><h2>👕 Garderobe</h2><div class="preview">${avatarHTML(S.color,S.hat).replace('width="40" height="40"','width="100" height="100"')}</div><p class="fine" style="text-align:center">⭐ ${S.stars} Sterne. Sterne gibt es für jede richtige Rechnung, für erledigte Aufgaben und für Siege.</p>
  <h3>Farbe <span class="fine">(${COLORS.length} Farben, alle gratis)</span></h3><div class="colors">${COLORS.map((c,i)=>`<button class="cs ${S.color===i?'on':''}" style="--c:${c[1]}" data-act="setColor" data-arg="${i}" aria-pressed="${S.color===i}">${avatarHTML(i,'')}${c[0]}</button>`).join('')}</div>
  <h3>Kopfbedeckung <span class="fine">(${HATS.filter(h=>h[0]&&S.owned[h[0]]).length} von ${HATS.length-1} gesammelt)</span></h3>${(()=>{const nx=HATS.filter(h=>!S.owned[h[0]]).sort((a,b)=>a[1]-b[1])[0];return nx?`<p class="fine">Nächstes Ziel: ${nx[0]} ${nx[2]} für ⭐ ${nx[1]}${S.stars<nx[1]?` (noch ${nx[1]-S.stars} Sterne)`:' – kannst du jetzt kaufen!'}</p>`:'<p class="fine">Du hast alle Kopfbedeckungen! 🏆</p>'})()}
  ${HAT_CATS.map(([cat,label])=>`<h4 class="hcat">${label}</h4><div class="hats">${HATS.filter(h=>h[3]===cat).sort((a,b)=>a[1]-b[1]).map(([e,p,n])=>{const own=S.owned[e],can=!own&&S.stars>=p;return `<button class="hb ${S.hat===e?'on':''} ${own?'':'lock'} ${can?'can':''}" data-act="setHat" data-arg="${e}" aria-pressed="${S.hat===e}"><span class="e">${e||'—'}</span>${n}<span>${own?(S.hat===e?'✓ an':'anziehen'):'⭐ '+p}</span></button>`}).join('')}</div>`).join('')}
  <button class="btn go" data-act="home">Fertig</button></div></div>`)};
const keepScroll=f=>{const y=screenEl.scrollTop;f();screenEl.scrollTop=y};
ACT.setColor=i=>{S.color=+i;save();keepScroll(ACT.wardrobe)};
ACT.setHat=e=>{e=e||'';const h=HATS.find(x=>x[0]===e);if(!S.owned[e]){if(S.stars<h[1])return toast(`Dafür brauchst du ${h[1]} Sterne. Rechne weiter!`);S.stars-=h[1];S.owned[e]=1;sfx('win');toast(`${h[2]} gekauft!`)}S.hat=e;save();keepScroll(ACT.wardrobe)};
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
ACT.parents=()=>{const d=S.days[dayKey()]||[0,0];openScreen(`<div class="wrap"><div class="panel"><h2>Für Eltern</h2>
  <div class="kpis"><div><b>${minToday()}</b><span>Rechenminuten heute</span></div><div><b>${d[0]+d[1]}</b><span>Aufgaben heute (${pct(d[0],d[0]+d[1])} richtig)</span></div><div><b>${S.games}</b><span>Runden (${S.wins} gewonnen)</span></div></div>
  <p class="fine">Die Rechenminuten zählen zusätzlich für das Tagesziel in Zahlcraft. Gezählt wird nur die Zeit mit offener Aufgabe (max. 60 s pro Aufgabe) und das Lesen des Rechenwegs. Logisches Denken üben die Kinder in den Besprechungen: Aussagen vergleichen, Widersprüche erkennen.</p>
  <h3>Themen und Stufen</h3><table class="tbl"><thead><tr><th>Thema</th><th>Stufe</th><th>✓</th><th>✗</th></tr></thead><tbody>${Object.entries(TOPICS).map(([t,n])=>{const s=stat(t),fx=S.settings.fix[t]||'';return `<tr><td>${n}</td><td><select class="fixsel" data-topic="${t}"><option value="" ${!fx?'selected':''}>Auto (${s.s})</option>${[1,2,3].map(v=>`<option value="${v}" ${String(fx)===String(v)?'selected':''}>fix ${v}</option>`).join('')}</select></td><td>${s.r}</td><td>${s.f}</td></tr>`}).join('')}</tbody></table>
  <h3>Zuletzt falsch gelöst</h3>${S.log.length?S.log.slice(0,10).map(l=>`<div class="rowx"><span>${esc(l.t)}</span><span>${esc(l.g)} → <b>${esc(String(l.a))}</b></span></div>`).join(''):'<p class="fine">Noch keine Fehler.</p>'}
  <label class="rowx" for="optSound"><span>Töne</span><input type="checkbox" id="optSound" ${S.settings.sound?'checked':''}></label>
  <button class="btn go" data-act="home">Zurück</button></div></div>`);
  screenEl.querySelectorAll('.fixsel').forEach(s=>s.addEventListener('change',e=>{const t=e.target.dataset.topic,v=e.target.value;if(v){S.settings.fix[t]=+v;stat(t).s=+v}else delete S.settings.fix[t];save()}));$('#optSound').addEventListener('change',e=>{S.settings.sound=e.target.checked;save()})};
function nameScreen(){openScreen(`<div class="wrap"><h1 class="logo">ZAHLONGUS</h1><p class="sub">Rechnen · Rätseln · Verräter finden</p><div class="panel"><form id="nf"><label for="pn" class="fine">Wie heisst du?</label><input id="pn" class="inp" maxlength="12" autocomplete="off" placeholder="Dein Vorname"><button class="btn go" type="submit">Los geht's</button></form></div></div>`);
  $('#nf').addEventListener('submit',e=>{e.preventDefault();unlockAudio();const n=$('#pn').value.trim();if(!n)return toast('Bitte schreib zuerst deinen Namen.');let name=n;try{const zc=JSON.parse(localStorage.getItem('zahlcraft_v1')||'null');if(zc&&zc.name&&!n)name=zc.name}catch(_){}S=fresh(name);S.color=R(0,COLORS.length-1);save();home()})}
(function boot(){const sv=load();if(sv){S=sv;migrate();home()}else{nameScreen();try{const zc=JSON.parse(localStorage.getItem('zahlcraft_v1')||'null');if(zc&&zc.name)$('#pn').value=zc.name}catch(_){}}
  if(/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host))setTimeout(()=>{fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/APP_VERSION='([^']+)'/);if(m&&m[1]!==APP_VERSION&&sessionStorage.getItem('zl_upd')!==m[1]){sessionStorage.setItem('zl_upd',m[1]);save();location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}}).catch(()=>{})},1500)})();
window.__zl={get S(){return S},get G(){return G},ask:()=>Q,startMeeting,freeze,checkEnd,update};
})();
</script>
</body>
</html>
